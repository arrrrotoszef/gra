<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasz Pupil PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --p-main: #6c5ce7;
            --p-accent: #a29bfe;
            --p-bg: #f0f3f7;
            --p-pink: #ff85a1;
            --p-gold: #fdce00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: #2d3436; display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #app {
            width: 400px; height: 800px; background: var(--p-bg);
            border-radius: 40px; border: 8px solid #1e272e; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        }

        /* STATSY */
        .top-nav { padding: 20px; background: white; border-bottom: 2px solid #ddd; }
        .stat-row { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; font-size: 12px; font-weight: bold; }
        .bar-outer { flex-grow: 1; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .bar-inner { height: 100%; width: 50%; transition: 0.5s; border-radius: 5px; }

        /* GŁÓWNA SCENA */
        .game-world { flex-grow: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(#81ecec, #74b9ff); }
        #pet-container { width: 280px; height: 280px; position: relative; z-index: 5; transition: 0.3s; }
        .shadow { width: 140px; height: 20px; background: rgba(0,0,0,0.1); border-radius: 50%; filter: blur(5px); margin-top: -20px; }

        /* MODALE I MENU */
        .menu-overlay { 
            position: absolute; bottom: 0; width: 100%; height: 70%; 
            background: white; border-radius: 30px 30px 0 0; z-index: 100;
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: flex; flex-direction: column; padding: 20px;
        }
        .menu-overlay.active { transform: translateY(0); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; overflow-y: auto; padding: 10px; }
        .item-card { 
            background: #f9f9f9; padding: 10px; border-radius: 15px; text-align: center; 
            border: 2px solid transparent; cursor: pointer; transition: 0.2s;
        }
        .item-card:hover { border-color: var(--p-main); background: white; }

        /* DOLNE PRZYCISKI */
        .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); background: white; padding: 15px; gap: 10px; }
        .nav-btn { 
            background: #f1f2f6; border: none; padding: 12px 5px; border-radius: 15px; 
            font-weight: bold; cursor: pointer; font-size: 11px;
        }
        .nav-btn.active { background: var(--p-main); color: white; }

        /* MINI GRY */
        #game-canvas { position: absolute; inset: 0; background: #000; z-index: 200; display: none; }
        
        .mission-toast {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            background: var(--p-gold); padding: 10px 20px; border-radius: 20px;
            font-weight: bold; font-size: 13px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10; display: none;
        }

        /* SVG STYLING */
        .pet-body { fill: #fab1a0; stroke: #e17055; stroke-width: 4; }
        .eye { fill: #2d3436; }
        .blush { fill: #ff7675; opacity: 0.4; }
    </style>
</head>
<body>

<div id="app">
    <div id="mission-alert" class="mission-toast">MISJA UKOŃCZONA! +50 🪙</div>

    <div class="top-nav">
        <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
            <strong id="pet-name">GUCIO (LVL <span id="ui-lvl">1</span>)</strong>
            <span style="color: #27ae60; font-weight: bold;">🪙 <span id="ui-coins">0</span></span>
        </div>
        <div class="stat-row">🍲 <div class="bar-outer"><div id="bar-hunger" class="bar-inner" style="background:#ff7675"></div></div></div>
        <div class="stat-row">⚡ <div class="bar-outer"><div id="bar-energy" class="bar-inner" style="background:#fdcb6e"></div></div></div>
        <div class="stat-row">🎉 <div class="bar-outer"><div id="bar-happy" class="bar-inner" style="background:#55efc4"></div></div></div>
        <div class="stat-row">📈 <div class="bar-outer"><div id="bar-xp" class="bar-inner" style="background:#a29bfe; height: 5px;"></div></div></div>
    </div>

    <div class="game-world">
        <div id="pet-container">
            <svg viewBox="0 0 200 200">
                <path class="pet-body" d="M100,180 Q30,180 30,110 Q30,40 100,40 Q170,40 170,110 Q170,180 100,180" />
                <circle cx="50" cy="50" r="25" class="pet-body" />
                <circle cx="150" cy="50" r="25" class="pet-body" />
                <circle class="eye" id="eye-l" cx="70" cy="100" r="6" />
                <circle class="eye" id="eye-r" cx="130" cy="100" r="6" />
                <circle class="blush" cx="60" cy="120" r="10" />
                <circle class="blush" cx="140" cy="120" r="10" />
                <path d="M90,140 Q100,150 110,140" fill="none" stroke="#2d3436" stroke-width="3" stroke-linecap="round" />
                
                <g id="layer-hat"></g>
                <g id="layer-neck"></g>
                <g id="layer-eyes"></g>
            </svg>
        </div>
        <div class="shadow"></div>
    </div>

    <div id="menu-food" class="menu-overlay">
        <h3>Spiżarnia (20+ produktów)</h3>
        <div class="grid" id="food-list"></div>
        <button class="nav-btn" onclick="closeMenus()" style="margin-top:10px">Zamknij</button>
    </div>

    <div id="menu-wardrobe" class="menu-overlay">
        <h3>Szafa</h3>
        <div class="grid" id="clothes-list"></div>
        <button class="nav-btn" onclick="closeMenus()" style="margin-top:10px">Zamknij</button>
    </div>

    <div id="menu-games" class="menu-overlay">
        <h3>Mini Gry</h3>
        <div class="grid">
            <div class="item-card" onclick="startGame('catcher')">🍎 Łapacz<br><small>Zręczność</small></div>
            <div class="item-card" onclick="startGame('clicker')">🖱️ Klikacz<br><small>Szybkość</small></div>
            <div class="item-card" onclick="startGame('quiz')">🧠 Quiz<br><small>Logika</small></div>
            <div class="item-card" onclick="startGame('reflex')">🎯 Refleks<br><small>Czas</small></div>
            <div class="item-card" onclick="startGame('memory')">🃏 Pamięć<br><small>Umysł</small></div>
        </div>
        <button class="nav-btn" onclick="closeMenus()" style="margin-top:10px">Zamknij</button>
    </div>

    <div id="game-canvas-container" style="display:none; position:absolute; inset:0; z-index:500; background:white; padding:20px; text-align:center;">
        <h2 id="game-title">Gra</h2>
        <div id="game-area" style="width:100%; height:400px; background:#f0f0f0; position:relative; overflow:hidden; border-radius:20px;"></div>
        <p id="game-score" style="font-size:24px; margin:20px 0;">Wynik: 0</p>
        <button class="nav-btn" id="btn-exit-game" style="width:100%; background:var(--p-pink); color:white;">ZAKOŃCZ</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="openMenu('food')">KARMIENIE</button>
        <button class="nav-btn" onclick="openMenu('wardrobe')">UBRANIA</button>
        <button class="nav-btn" onclick="openMenu('games')">GRY</button>
        <button class="nav-btn" onclick="handleAction('sleep')">SEN</button>
    </div>
</div>

<script>
// --- KONFIGURACJA FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyD8qaNZKjmenGo0MxL4dI7MYb2khcHSUes",
    authDomain: "graznatalia-e1b58.firebaseapp.com",
    projectId: "graznatalia-e1b58",
    storageBucket: "graznatalia-e1b58.firebasestorage.app",
    messagingSenderId: "265631462505",
    appId: "1:265631462505:web:40b3bb8c72908cf8461ef8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const petDoc = db.collection("super_pet").doc("main_save");

// --- DANE GRY ---
const FOOD_ITEMS = [
    { n: "Pizza", v: 20, c: 50 }, { n: "Burger", v: 25, c: 60 }, { n: "Sushi", v: 15, c: 80 },
    { n: "Ramen", v: 30, c: 90 }, { n: "Taco", v: 12, c: 30 }, { n: "Stek", v: 40, c: 150 },
    { n: "Pączek", v: 10, c: 20 }, { n: "Lody", v: 8, c: 15 }, { n: "Arbuz", v: 5, c: 10 },
    { n: "Jabłko", v: 5, c: 5 }, { n: "Brokuł", v: 2, c: 2 }, { n: "Ciastko", v: 12, c: 25 },
    { n: "Frytki", v: 15, c: 35 }, { n: "HotDog", v: 18, c: 45 }, { n: "Sałatka", v: 10, c: 30 },
    { n: "Kawa", v: 5, c: 15 }, { n: "Mleko", v: 7, c: 10 }, { n: "Tort", v: 50, c: 200 },
    { n: "Ryż", v: 15, c: 20 }, { n: "Zupa", v: 20, c: 40 }
];

const CLOTHES = [
    { id: 'crown', n: 'Korona', c: 500, layer: 'hat', svg: '<path d="M60,45 L80,20 L100,45 L120,20 L140,45 Z" fill="#f1c40f" stroke="#d35400" />' },
    { id: 'glasses', n: 'Okulary 3D', c: 150, layer: 'eyes', svg: '<rect x="60" y="90" width="80" height="20" rx="5" fill="black" /><rect x="65" y="93" width="30" height="14" fill="#ff7675"/><rect x="105" y="93" width="30" height="14" fill="#74b9ff"/>' },
    { id: 'tie', n: 'Mucha', c: 100, layer: 'neck', svg: '<path d="M85,170 L115,170 L100,155 Z" fill="red" />' },
    { id: 'cap', n: 'Czapka', c: 200, layer: 'hat', svg: '<path d="M60,50 Q100,10 140,50 Z" fill="#0984e3"/><rect x="110" y="45" width="40" height="8" fill="#0984e3"/>' },
    { id: 'none', n: 'Zdejmij', c: 0, layer: 'all', svg: '' }
];

let state = {
    hunger: 50, energy: 50, happy: 50, coins: 200, xp: 0, lvl: 1, 
    outfit: { hat: '', eyes: '', neck: '' },
    missions_done: 0
};

// --- LOGIKA BAZY ---
petDoc.onSnapshot(doc => {
    if(doc.exists) {
        state = doc.data();
        updateUI();
    } else {
        petDoc.set(state);
    }
});

function updateUI() {
    document.getElementById('bar-hunger').style.width = state.hunger + '%';
    document.getElementById('bar-energy').style.width = state.energy + '%';
    document.getElementById('bar-happy').style.width = state.happy + '%';
    document.getElementById('bar-xp').style.width = (state.xp % 100) + '%';
    document.getElementById('ui-coins').innerText = state.coins;
    document.getElementById('ui-lvl').innerText = state.lvl;

    // Renderowanie ubrań na SVG
    document.getElementById('layer-hat').innerHTML = state.outfit.hat || '';
    document.getElementById('layer-eyes').innerHTML = state.outfit.eyes || '';
    document.getElementById('layer-neck').innerHTML = state.outfit.neck || '';
}

// --- AKCJE ---
function openMenu(type) {
    closeMenus();
    document.getElementById('menu-' + type).classList.add('active');
    if(type === 'food') renderFood();
    if(type === 'wardrobe') renderClothes();
}

function closeMenus() {
    document.querySelectorAll('.menu-overlay').forEach(m => m.classList.remove('active'));
}

function renderFood() {
    const cont = document.getElementById('food-list');
    cont.innerHTML = FOOD_ITEMS.map(f => `
        <div class="item-card" onclick="buyFood(${f.v}, ${f.c})">
            ${f.n}<br><b>${f.c} 🪙</b><br><small>+${f.v}🍗</small>
        </div>
    `).join('');
}

function renderClothes() {
    const cont = document.getElementById('clothes-list');
    cont.innerHTML = CLOTHES.map(c => `
        <div class="item-card" onclick="buyCloth('${c.id}')">
            ${c.n}<br><b>${c.c} 🪙</b>
        </div>
    `).join('');
}

async function buyFood(val, cost) {
    if(state.coins >= cost) {
        let newHunger = Math.min(100, state.hunger + val);
        await petDoc.update({ 
            coins: state.coins - cost, 
            hunger: newHunger,
            xp: state.xp + 5 
        });
        checkLevel();
    }
}

async function buyCloth(id) {
    const item = CLOTHES.find(c => c.id === id);
    if(state.coins >= item.c) {
        let newOutfit = {...state.outfit};
        if(item.layer === 'all') {
            newOutfit = { hat: '', eyes: '', neck: '' };
        } else {
            newOutfit[item.layer] = item.svg;
        }
        await petDoc.update({ outfit: newOutfit, coins: state.coins - item.c });
    }
}

async function handleAction(type) {
    if(type === 'sleep') {
        await petDoc.update({ energy: 100, hunger: Math.max(0, state.hunger - 20) });
    }
}

function checkLevel() {
    let newLvl = Math.floor(state.xp / 100) + 1;
    if(newLvl > state.lvl) {
        petDoc.update({ lvl: newLvl });
        showMissionAlert("AWANS NA POZIOM " + newLvl + "! +100 🪙");
        petDoc.update({ coins: state.coins + 100 });
    }
}

function showMissionAlert(txt) {
    const alert = document.getElementById('mission-alert');
    alert.innerText = txt;
    alert.style.display = 'block';
    setTimeout(() => alert.style.display = 'none', 3000);
}

// --- MINI GRY SYSTEM ---
let currentGame = null;
let gameScore = 0;

function startGame(type) {
    closeMenus();
    document.getElementById('game-canvas-container').style.display = 'block';
    document.getElementById('game-area').innerHTML = '';
    gameScore = 0;
    updateGameScore();
    
    if(type === 'clicker') runClicker();
    if(type === 'quiz') runQuiz();
    if(type === 'catcher') runCatcher();
    if(type === 'reflex') runReflex();
    if(type === 'memory') runMemory();
}

function updateGameScore() {
    document.getElementById('game-score').innerText = "Wynik: " + gameScore;
}

// 1. KLIKACZ
function runClicker() {
    const area = document.getElementById('game-area');
    const btn = document.createElement('div');
    btn.style = "width:100px; height:100px; background:var(--p-pink); border-radius:50%; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); cursor:pointer; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;";
    btn.innerText = "KLIKAJ!";
    btn.onclick = () => {
        gameScore++;
        updateGameScore();
        btn.style.left = Math.random() * 80 + 10 + "%";
        btn.style.top = Math.random() * 80 + 10 + "%";
    };
    area.appendChild(btn);
}

// 2. QUIZ
function runQuiz() {
    const area = document.getElementById('game-area');
    function nextQ() {
        area.innerHTML = '';
        let a = Math.floor(Math.random()*10);
        let b = Math.floor(Math.random()*10);
        let correct = a + b;
        let qText = document.createElement('h3');
        qText.innerText = `Ile to ${a} + ${b}?`;
        area.appendChild(qText);
        
        [correct, correct+1, correct-1].sort(() => Math.random()-0.5).forEach(ans => {
            let b = document.createElement('button');
            b.className = "nav-btn"; b.style.width="80%"; b.style.margin="5px";
            b.innerText = ans;
            b.onclick = () => {
                if(ans === correct) { gameScore += 10; updateGameScore(); nextQ(); }
                else { alert("Źle!"); exitGame(); }
            };
            area.appendChild(b);
        });
    }
    nextQ();
}

// 3. ŁAPACZ (Catcher)
function runCatcher() {
    const area = document.getElementById('game-area');
    let p = document.createElement('div');
    p.style = "width:60px; height:20px; background:black; position:absolute; bottom:10px; left:50%; transition:0.1s";
    area.appendChild(p);
    
    area.onmousemove = (e) => {
        let rect = area.getBoundingClientRect();
        let x = e.clientX - rect.left;
        p.style.left = (x - 30) + "px";
    };

    let interval = setInterval(() => {
        let drop = document.createElement('div');
        drop.innerText = "🍎";
        drop.style = "position:absolute; top:0; left:" + (Math.random()*90) + "%; font-size:24px; transition: 2s linear";
        area.appendChild(drop);
        setTimeout(() => drop.style.top = "400px", 100);
        
        let check = setInterval(() => {
            let dRect = drop.getBoundingClientRect();
            let pRect = p.getBoundingClientRect();
            if(dRect.bottom >= pRect.top && dRect.left < pRect.right && dRect.right > pRect.left) {
                gameScore += 5; updateGameScore();
                drop.remove(); clearInterval(check);
            }
        }, 50);
        
        setTimeout(() => { drop.remove(); clearInterval(check); }, 2100);
    }, 1000);
    
    currentGameInterval = interval;
}

// 4. REFLEKS
function runReflex() {
    const area = document.getElementById('game-area');
    area.innerHTML = "<h3>Kliknij gdy zobaczysz CZERWONY!</h3>";
    function wait() {
        area.style.background = "#f0f0f0";
        setTimeout(() => {
            area.style.background = "red";
            area.onclick = () => {
                gameScore += 20; updateGameScore();
                area.onclick = null;
                wait();
            };
        }, Math.random() * 3000 + 1000);
    }
    wait();
}

// 5. PAMIĘĆ (Memory)
function runMemory() {
    const area = document.getElementById('game-area');
    area.style.display = "grid"; area.style.gridTemplateColumns = "repeat(3, 1fr)";
    let icons = ["🍎","🍎","🍕","🍕","💎","💎"];
    icons.sort(() => Math.random() - 0.5).forEach(icon => {
        let card = document.createElement('div');
        card.style = "height:100px; background:white; border:1px solid #ccc; display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer";
        card.innerText = "?";
        card.onclick = () => {
            card.innerText = icon;
            setTimeout(() => { if(card.innerText !== "✅") card.innerText = "?"; }, 1000);
            // Prosta wersja: dostajesz pkt za każde odkrycie, w prawdziwej grze byłaby logika par
            gameScore += 1; updateGameScore();
        };
        area.appendChild(card);
    });
}

function exitGame() {
    if(typeof currentGameInterval !== 'undefined') clearInterval(currentGameInterval);
    document.getElementById('game-canvas-container').style.display = 'none';
    let reward = gameScore;
    petDoc.update({ 
        coins: state.coins + reward, 
        happy: Math.min(100, state.happy + 20),
        xp: state.xp + Math.floor(reward/2)
    });
    showMissionAlert("ZAROBIONO: " + reward + " 🪙");
    checkLevel();
}

document.getElementById('btn-exit-game').onclick = exitGame;

// Spadek statystyk
setInterval(() => {
    petDoc.update({
        hunger: Math.max(0, state.hunger - 1),
        energy: Math.max(0, state.energy - 0.5),
        happy: Math.max(0, state.happy - 0.5)
    });
}, 30000);

</script>
</body>
</html>
