<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nasz Słodki Kotek V5 🐾</title>
  <style>
    :root {
      --primary: #a29bfe;
      --bg: #f5f6fa;
      --panel: #ffffff;
      --text: #2f3640;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; background-color: var(--bg); margin: 0; padding: 10px;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text);
      transition: background 0.5s;
    }
    
    /* Top Bar */
    .top-bar {
      display: flex; justify-content: space-between; width: 95%; max-width: 450px;
      background: var(--panel); padding: 15px 20px; border-radius: 20px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.05); margin-top: 5px; font-weight: bold; box-sizing: border-box;
      z-index: 10;
    }
    .coins { color: #f39c12; font-size: 1.3em;}
    .level { color: #e84393; font-size: 1.3em;}

    h1 { margin: 15px 0 0 0; color: #6c5ce7; font-size: 2em; text-shadow: 1px 1px 0px white;}
    .player-info { color: #7f8fa6; font-size: 0.9em; margin-bottom: 10px; }
    .btn-small { background: none; border: 1px solid #7f8fa6; color: #7f8fa6; border-radius: 8px; padding: 2px 6px; cursor: pointer; font-size: 0.8em; margin-left: 5px; }

    /* ========================================= */
    /* SCENA I TŁA KOTKA                         */
    /* ========================================= */
    #cat-stage { 
      width: 250px; height: 250px; margin: 10px 0; position: relative;
      border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.5s; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    
    /* Style Tła */
    .bg-default { background: linear-gradient(135deg, #ffeaa7, #fab1a0); }
    .bg-garden { background: linear-gradient(135deg, #55efc4, #00b894); }
    .bg-night { background: linear-gradient(135deg, #2d3436, #636e72); }
    .bg-space { background: linear-gradient(135deg, #090a0f, #27104e, #9b59b6); }

    #animated-cat { width: 90%; height: 90%; animation: float 3.5s ease-in-out infinite; z-index: 2; }
    
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes blink { 0%, 4%, 100% { transform: scaleY(1); } 2% { transform: scaleY(0.1); } }
    @keyframes tailWag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } }
    .eye-group { animation: blink 4s infinite; transform-origin: center; }
    .tail { animation: tailWag 4s ease-in-out infinite; transform-origin: 75% 85%; }
    .happy-jump { animation: happyJump 0.5s ease !important; }
    @keyframes happyJump { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-25px) scale(1.05); } }

    /* ========================================= */
    /* INTERFEJS                                 */
    /* ========================================= */
    .panel {
      width: 95%; max-width: 450px; background: var(--panel); padding: 15px;
      border-radius: 20px; box-shadow: 0 8px 15px rgba(0,0,0,0.05); margin-bottom: 15px; box-sizing: border-box;
      position: relative; z-index: 10;
    }
    .stat-row { margin-bottom: 8px; text-align: left; font-size: 0.9em; font-weight: bold; color: #555; }
    .bar-bg { background-color: #f1f2f6; border-radius: 10px; height: 18px; width: 100%; margin-top: 5px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.4s ease, background-color 0.4s ease; }
    #bar-food { background-color: #00cec9; }
    #bar-water { background-color: #0984e3; }
    
    .panel-title { font-size: 0.9em; text-transform: uppercase; color: #b2bec3; margin-bottom: 10px; letter-spacing: 1px; font-weight: bold;}
    .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    button {
      padding: 12px 5px; font-size: 0.9em; border: none; border-radius: 15px;
      cursor: pointer; color: white; font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.1s; -webkit-tap-highlight-color: transparent;
    }
    button span { font-size: 1.5em; display: block; margin-bottom: 2px; }
    button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    button:disabled { filter: grayscale(100%); opacity: 0.5; cursor: not-allowed; }

    .btn-action { background-color: var(--primary); }
    .btn-shop { background-color: #fdcb6e; color: #2d3436; }
    .btn-minigame { background-color: #ff7675; width: 100%; padding: 12px; font-size: 1.05em; margin-top: 8px; }

    /* Kategorie Sklepu */
    .shop-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
    .shop-tab { flex: 1; padding: 8px 10px; font-size: 0.8em; background: #dfe6e9; color: #2d3436; border-radius: 10px; white-space: nowrap;}
    .shop-tab.active { background: #6c5ce7; color: white; }

    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 5px;}
    .shop-item { background: #f8f9fa; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 1px solid #f1f2f6;}
    .shop-item-name { font-weight: bold; font-size: 0.85em; margin-bottom: 5px; text-align: center; }
    .shop-btn { width: 100%; padding: 8px 0; font-size: 0.85em; border-radius: 8px; margin-top: auto; color: white;}
    .shop-btn.buy { background-color: #00b894; }
    .shop-btn.equip { background-color: #0984e3; }
    .shop-btn.equipped { background-color: #b2bec3; box-shadow: inset 0 3px 5px rgba(0,0,0,0.1); }

    /* Minigame Modals */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 2000; color: white;
    }
    .game-area { width: 90%; max-width: 400px; height: 60%; max-height: 400px; background: #74b9ff; border-radius: 20px; position: relative; overflow: hidden; border: 5px solid white; }
    .game-target { position: absolute; font-size: 3.5em; cursor: pointer; user-select: none; transition: transform 0.1s; }
    .game-target:active { transform: scale(0.8); }
    .game-stats { font-size: 1.5em; margin-bottom: 15px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    
    /* Myszka Game Specific */
    #area-mouse { background: #55efc4; }
    .hole { position: absolute; width: 60px; height: 20px; background: rgba(0,0,0,0.3); border-radius: 50%; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="level">Serduszka: <span id="xp-text">0</span> ❤️</div>
    <div class="coins"><span id="coins-display">0</span> 🪙</div>
  </div>
  
  <h1 id="cat-name-display">Kotek</h1>
  <div class="player-info">
    Grasz jako: <strong id="current-player-display">Gracz</strong>
    <button class="btn-small" onclick="changeMyName()">Zmień Nick</button>
  </div>
  
  <div id="cat-stage" class="bg-default">
    <svg id="animated-cat" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      
      <path class="tail" d="M 140 160 Q 190 150 170 100 Q 150 70 190 60" fill="none" stroke="#a4b0be" stroke-width="18" stroke-linecap="round"/>
      
      <ellipse cx="100" cy="155" rx="58" ry="45" fill="#a4b0be" />
      <ellipse cx="100" cy="170" rx="40" ry="25" fill="#ffffff" /> <g id="cloth-bowtie" style="display: none;">
        <path d="M 100 135 L 80 120 L 80 150 Z" fill="#e84393"/>
        <path d="M 100 135 L 120 120 L 120 150 Z" fill="#e84393"/>
        <circle cx="100" cy="135" r="6" fill="#fd79a8"/>
      </g>
      <g id="cloth-scarf" style="display: none;">
        <path d="M 50 125 Q 100 150 150 125 L 140 140 Q 100 165 60 140 Z" fill="#d63031"/>
        <path d="M 125 130 L 120 170 L 140 165 Z" fill="#d63031"/>
      </g>
      <g id="cloth-sweater" style="display: none;">
        <path d="M 45 155 Q 100 110 155 155 L 140 190 Q 100 205 60 190 Z" fill="#0984e3"/>
        <path d="M 60 190 Q 100 200 140 190 L 140 180 Q 100 190 60 180 Z" fill="#74b9ff"/> </g>

      <path d="M 45 95 L 30 30 L 85 55 Z" fill="#a4b0be" stroke="#747d8c" stroke-width="2"/> <path d="M 45 85 L 37 40 L 75 60 Z" fill="#ffcccc" /> <path d="M 155 95 L 170 30 L 115 55 Z" fill="#a4b0be" stroke="#747d8c" stroke-width="2"/> <path d="M 155 85 L 163 40 L 125 60 Z" fill="#ffcccc" /> <circle cx="100" cy="90" r="55" fill="#a4b0be" />
      <ellipse cx="100" cy="115" rx="25" ry="15" fill="#ffffff" /> <path d="M 92 115 Q 100 125 108 115" fill="none" stroke="#2f3640" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="100" cy="110" r="4" fill="#ff7675"/> <g class="eye-group">
        <circle cx="70" cy="90" r="14" fill="#f1c40f"/>
        <circle cx="70" cy="90" r="10" fill="#2d3436"/>
        <circle cx="67" cy="85" r="4" fill="#ffffff"/> 
        
        <circle cx="130" cy="90" r="14" fill="#f1c40f"/>
        <circle cx="130" cy="90" r="10" fill="#2d3436"/>
        <circle cx="127" cy="85" r="4" fill="#ffffff"/>
      </g>

      <path d="M 60 180 Q 65 200 85 195" fill="#ffffff" stroke="#747d8c" stroke-width="2"/> 
      <path d="M 140 180 Q 135 200 115 195" fill="#ffffff" stroke="#747d8c" stroke-width="2"/> 

      <g id="cloth-sunglasses" style="display: none;">
        <rect x="52" y="75" width="36" height="24" rx="4" fill="#2d3436"/>
        <rect x="112" y="75" width="36" height="24" rx="4" fill="#2d3436"/>
        <line x1="88" y1="85" x2="112" y2="85" stroke="#2d3436" stroke-width="4"/>
      </g>
      <g id="cloth-nerd" style="display: none;">
        <circle cx="70" cy="90" r="18" fill="none" stroke="#e84393" stroke-width="4"/>
        <circle cx="130" cy="90" r="18" fill="none" stroke="#e84393" stroke-width="4"/>
        <line x1="88" y1="90" x2="112" y2="90" stroke="#e84393" stroke-width="4"/>
      </g>

      <g id="cloth-crown" style="display: none;">
        <path d="M 65 45 L 55 5 L 85 25 L 100 -5 L 115 25 L 145 5 L 135 45 Z" fill="#f1c40f"/>
        <circle cx="55" cy="5" r="5" fill="#e84393"/>
        <circle cx="100" cy="-5" r="5" fill="#0984e3"/>
        <circle cx="145" cy="5" r="5" fill="#e84393"/>
      </g>
      <g id="cloth-cap" style="display: none;">
        <path d="M 50 45 Q 100 -10 150 45 Z" fill="#d63031"/>
        <path d="M 150 45 Q 180 40 180 50 Q 150 55 130 45" fill="#ff7675"/> <circle cx="100" cy="15" r="6" fill="#ffffff"/>
      </g>
    </svg>
  </div>
  
  <div class="panel">
    <div class="stat-row">🍗 Brzuszek (<span id="food-text">100</span>%)
      <div class="bar-bg"><div id="bar-food" class="bar-fill"></div></div>
    </div>
    <div class="stat-row" style="margin-bottom:0;">💧 Pragnienie (<span id="water-text">100</span>%)
      <div class="bar-bg"><div id="bar-water" class="bar-fill"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Opieka</div>
    <div class="buttons-grid">
      <button class="btn-action" onclick="doAction('pet')"><span>🐾</span> Głaskaj<br><small>+1❤️ | -10 E</small></button>
      <button class="btn-action" onclick="doAction('play')"><span>🧶</span> Baw się<br><small>+3❤️ | -25 E</small></button>
      <button class="btn-shop" onclick="doAction('buyFood')"><span>🐟</span> Nakarm<br><small>10 🪙</small></button>
      <button class="btn-shop" onclick="doAction('buyWater')"><span>🥛</span> Daj pić<br><small>5 🪙</small></button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Rozrywka (Zarabiaj Monety)</div>
    <div class="buttons-grid">
      <button class="btn-minigame" onclick="openGame('fish')">🎣 Złap Rybkę</button>
      <button class="btn-minigame" style="background:#00b894;" onclick="openGame('mouse')">🐭 Złap Mysz</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Sklep i Szafa</div>
    <div class="shop-tabs">
      <button class="shop-tab active" onclick="switchTab('clothes')">Ubrania</button>
      <button class="shop-tab" onclick="switchTab('hats')">Czapki</button>
      <button class="shop-tab" onclick="switchTab('glasses')">Okulary</button>
      <button class="shop-tab" onclick="switchTab('bgs')">Tła</button>
    </div>
    <div class="shop-grid" id="shop-container"></div>
  </div>

  <div id="modal-fish" class="modal">
    <div class="game-stats">Czas: <span id="time-fish">15</span>s | Zebrano: <span id="score-fish">0</span> 🪙</div>
    <div id="area-fish" class="game-area">
      <div id="obj-fish" class="game-target" onclick="clickTarget('fish')">🐟</div>
    </div>
    <button class="btn-action" style="margin-top:20px; padding: 15px 30px;" onclick="closeGame()">Zakończ</button>
  </div>

  <div id="modal-mouse" class="modal">
    <div class="game-stats">Czas: <span id="time-mouse">15</span>s | Złapano: <span id="score-mouse">0</span> 🪙</div>
    <div id="area-mouse" class="game-area">
      <div class="hole" style="top:20%; left:20%;"></div>
      <div class="hole" style="top:20%; left:60%;"></div>
      <div class="hole" style="top:60%; left:20%;"></div>
      <div class="hole" style="top:60%; left:60%;"></div>
      <div class="hole" style="top:40%; left:40%;"></div>
      <div id="obj-mouse" class="game-target" onclick="clickTarget('mouse')" style="font-size:3em;">🐭</div>
    </div>
    <button class="btn-action" style="margin-top:20px; padding: 15px 30px;" onclick="closeGame()">Zakończ</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8qaNZKjmenGo0MxL4dI7MYb2khcHSUes",
      authDomain: "graznatalia-e1b58.firebaseapp.com",
      projectId: "graznatalia-e1b58",
      storageBucket: "graznatalia-e1b58.firebasestorage.app",
      messagingSenderId: "265631462505",
      appId: "1:265631462505:web:40b3bb8c72908cf8461ef8",
      measurementId: "G-JWW9JW9TD0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const catDocRef = doc(db, "gra", "wspolny_kotek_v5"); // V5 - Nowa Struktura!

    // Baza Przedmiotów podzielona na kategorie
    const shopDB = {
      clothes: [
        { id: 'none', name: 'Brak Ubranka', price: 0, emoji: '🚫' },
        { id: 'bowtie', name: 'Różowa Mucha', price: 20, emoji: '🎀' },
        { id: 'scarf', name: 'Ciepły Szalik', price: 35, emoji: '🧣' },
        { id: 'sweater', name: 'Niebieski Sweter', price: 60, emoji: '🧥' }
      ],
      hats: [
        { id: 'none', name: 'Bez Czapki', price: 0, emoji: '🚫' },
        { id: 'cap', name: 'Czapka z Daszkiem', price: 40, emoji: '🧢' },
        { id: 'crown', name: 'Złota Korona', price: 150, emoji: '👑' }
      ],
      glasses: [
        { id: 'none', name: 'Bez Okularów', price: 0, emoji: '🚫' },
        { id: 'sunglasses', name: 'Przeciwsłoneczne', price: 30, emoji: '🕶️' },
        { id: 'nerd', name: 'Różowe Kujonki', price: 50, emoji: '👓' }
      ],
      bgs: [
        { id: 'default', name: 'Domowy Pokój', price: 0, emoji: '🏠' },
        { id: 'garden', name: 'Słoneczny Ogród', price: 80, emoji: '🌳' },
        { id: 'night', name: 'Nocna Sypialnia', price: 100, emoji: '🌙' },
        { id: 'space', name: 'Magiczny Kosmos', price: 200, emoji: '🚀' }
      ]
    };

    let currentTab = 'clothes';
    let state = { 
      catName: "Puszek", xp: 0, coins: 50, food: 100, water: 100, 
      inventory: ['clothes_none', 'hats_none', 'glasses_none', 'bgs_default'], 
      equipped: { clothes: 'none', hats: 'none', glasses: 'none', bgs: 'default' } 
    };
    
    // Obsługa Imienia
    let myName = localStorage.getItem("playerName");
    if(!myName) {
        myName = prompt("Wpisz swoje imię:") || "Gracz";
        localStorage.setItem("playerName", myName);
    }
    document.getElementById("current-player-display").innerText = myName;

    window.changeMyName = function() {
        const newName = prompt("Zmień swój nick:", myName);
        if(newName && newName.trim() !== "") {
            myName = newName.trim();
            localStorage.setItem("playerName", myName);
            document.getElementById("current-player-display").innerText = myName;
        }
    }

    // --- RENDER SKLEPU ---
    window.switchTab = function(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderShop();
    }

    function renderShop() {
      const container = document.getElementById("shop-container");
      container.innerHTML = "";
      
      shopDB[currentTab].forEach(item => {
        const globalId = `${currentTab}_${item.id}`; // np. hats_crown
        const isOwned = state.inventory.includes(globalId);
        const isEquipped = state.equipped[currentTab] === item.id;
        
        let btnHTML = "";
        if (isEquipped) {
            btnHTML = `<button class="shop-btn equipped" disabled>Używane</button>`;
        } else if (isOwned) {
            btnHTML = `<button class="shop-btn equip" onclick="equipItem('${currentTab}', '${item.id}')">Użyj</button>`;
        } else {
            btnHTML = `<button class="shop-btn buy" onclick="buyItem('${currentTab}', '${item.id}', ${item.price})" ${state.coins < item.price ? 'disabled' : ''}>Kup (${item.price}🪙)</button>`;
        }

        container.innerHTML += `
          <div class="shop-item">
            <span style="font-size: 2em; margin-bottom: 5px;">${item.emoji}</span>
            <div class="shop-item-name">${item.name}</div>
            ${btnHTML}
          </div>
        `;
      });
    }

    // --- SYNCHRONIZACJA Z BAZĄ ---
    onSnapshot(catDocRef, (docSnap) => {
      if (docSnap.exists()) {
        state = docSnap.data();
        
        // Zabezpieczenie na wypadek brakujących struktur w bazie
        if(!state.equipped) state.equipped = { clothes: 'none', hats: 'none', glasses: 'none', bgs: 'default' };
        if(!state.inventory) state.inventory = ['clothes_none', 'hats_none', 'glasses_none', 'bgs_default'];

        document.getElementById("coins-display").innerText = state.coins;
        document.getElementById("xp-text").innerText = state.xp;
        
        document.getElementById("food-text").innerText = state.food;
        document.getElementById("bar-food").style.width = state.food + "%";
        document.getElementById("water-text").innerText = state.water;
        document.getElementById("bar-water").style.width = state.water + "%";

        applyEquipment();
        renderShop(); 
      } else {
        // Pierwsze utworzenie V5
        setDoc(catDocRef, state);
      }
    });

    function applyEquipment() {
        // Tło
        const stage = document.getElementById("cat-stage");
        stage.className = `bg-${state.equipped.bgs}`;

        // Ubrania (Ukryj wszystko)
        const allItems = ['bowtie', 'scarf', 'sweater', 'sunglasses', 'nerd', 'crown', 'cap'];
        allItems.forEach(id => {
            const el = document.getElementById(`cloth-${id}`);
            if(el) el.style.display = "none";
        });

        // Pokazuj wybrane
        if(state.equipped.clothes !== 'none') document.getElementById(`cloth-${state.equipped.clothes}`).style.display = "block";
        if(state.equipped.hats !== 'none') document.getElementById(`cloth-${state.equipped.hats}`).style.display = "block";
        if(state.equipped.glasses !== 'none') document.getElementById(`cloth-${state.equipped.glasses}`).style.display = "block";
    }

    // --- ZAKUPY ---
    window.buyItem = async function(category, itemId, price) {
        const globalId = `${category}_${itemId}`;
        if(state.coins >= price && !state.inventory.includes(globalId)) {
            const newCoins = state.coins - price;
            const newInventory = [...state.inventory, globalId];
            await updateDoc(catDocRef, { coins: newCoins, inventory: newInventory });
        }
    }
    
    window.equipItem = async function(category, itemId) {
        const globalId = `${category}_${itemId}`;
        if(state.inventory.includes(globalId)) {
            let newEquipped = { ...state.equipped };
            newEquipped[category] = itemId;
            await updateDoc(catDocRef, { equipped: newEquipped });
        }
    }

    // --- AKCJE OPIEKI ---
    window.doAction = async function(actionType) {
      let { xp, coins, food, water } = state;

      if (actionType === 'pet') {
        if (food < 10 || water < 10) return alert(`Kotek jest zbyt głodny!`);
        xp += 1; food -= 10; water -= 10; animateCat();
      } 
      else if (actionType === 'play') {
        if (food < 25 || water < 25) return alert(`Kotek opadł z sił!`);
        xp += 3; food -= 25; water -= 25; animateCat();
      }
      else if (actionType === 'buyFood') {
        if (coins < 10) return; coins -= 10; food += 40;
      }
      else if (actionType === 'buyWater') {
        if (coins < 5) return; coins -= 5; water += 40;
      }

      food = Math.max(0, Math.min(100, food));
      water = Math.max(0, Math.min(100, water));
      await updateDoc(catDocRef, { xp, coins, food, water });
    }

    function animateCat() {
        const cat = document.getElementById("animated-cat");
        cat.classList.remove("happy-jump");
        void cat.offsetWidth; 
        cat.classList.add("happy-jump");
    }

    // --- SYSTEM MINIGIER ---
    let gameInterval, gameTimer;
    let currentGame = null;
    let timeLeft = 15;
    let currentScore = 0;

    // Norki dla myszy
    const holes = [
        {top: 15, left: 15}, {top: 15, left: 55}, 
        {top: 55, left: 15}, {top: 55, left: 55}, {top: 35, left: 35}
    ];

    window.openGame = function(gameName) {
        currentGame = gameName;
        document.getElementById(`modal-${gameName}`).style.display = "flex";
        timeLeft = 15; currentScore = 0;
        
        document.getElementById(`time-${gameName}`).innerText = timeLeft;
        document.getElementById(`score-${gameName}`).innerText = currentScore;
        
        moveTarget();
        gameInterval = setInterval(moveTarget, gameName === 'fish' ? 800 : 700);
        
        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById(`time-${gameName}`).innerText = timeLeft;
            if(timeLeft <= 0) closeGame();
        }, 1000);
    }

    window.clickTarget = function(gameName) {
        currentScore++;
        document.getElementById(`score-${gameName}`).innerText = currentScore;
        const obj = document.getElementById(`obj-${gameName}`);
        obj.style.display = "none";
        setTimeout(moveTarget, 150);
    }

    function moveTarget() {
        const obj = document.getElementById(`obj-${currentGame}`);
        if(currentGame === 'fish') {
            const area = document.getElementById("area-fish");
            const maxX = area.clientWidth - 50;
            const maxY = area.clientHeight - 50;
            obj.style.left = Math.floor(Math.random() * maxX) + "px";
            obj.style.top = Math.floor(Math.random() * maxY) + "px";
        } else if (currentGame === 'mouse') {
            const randomHole = holes[Math.floor(Math.random() * holes.length)];
            obj.style.left = (randomHole.left - 2) + "%";
            obj.style.top = (randomHole.top - 8) + "%";
        }
        obj.style.display = "block";
    }

    window.closeGame = async function() {
        if(!currentGame) return;
        clearInterval(gameInterval);
        clearInterval(gameTimer);
        document.getElementById(`modal-${currentGame}`).style.display = "none";
        
        if (currentScore > 0) {
            alert(`Koniec czasu! Zarabiasz ${currentScore} 🪙`);
            await updateDoc(catDocRef, { coins: state.coins + currentScore });
        }
        currentGame = null;
    }
  </script>
</body>
</html>
