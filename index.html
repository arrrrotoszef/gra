<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header class="hud">
            <div class="stat-box">LVL: <span id="lvl">1</span></div>
            <div class="stat-box">XP: <span id="xp">0</span>/100</div>
            <div class="currency">
                <div class="coin">MONETY: <span id="coins">500</span></div>
                <div class="diamond">DIAMENTY: <span id="diamonds">10</span></div>
            </div>
        </header>

        <main class="game-view">
            <div id="pet-stage">
                <div class="pet" id="pet-character">
                    <div class="pet-body">
                        <div class="eyes">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                </div>
                <div id="pet-accessory-slot"></div>
            </div>

            <div class="status-bars">
                <div class="bar-container">
                    <label>GŁÓD</label>
                    <div class="bar"><div id="hunger-fill" class="fill hunger"></div></div>
                </div>
                <div class="bar-container">
                    <label>ENERGIA</label>
                    <div class="bar"><div id="energy-fill" class="fill energy"></div></div>
                </div>
                <div class="bar-container">
                    <label>SZCZĘŚCIE</label>
                    <div class="bar"><div id="happy-fill" class="fill happy"></div></div>
                </div>
            </div>
        </main>

        <aside id="chat-sidebar">
            <div class="chat-header">DZIEWCZYNA (NPC) - WIĘŹ: <span id="bond-lvl">1</span></div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <button onclick="interactWithGirl()">Rozmawiaj</button>
            </div>
        </aside>

        <nav class="actions">
            <button class="btn feed" onclick="action('feed')">KARM</button>
            <button class="btn wash" onclick="action('wash')">MYJ</button>
            <button class="btn play" onclick="action('play')">BAW SIĘ</button>
            <button class="btn sleep" onclick="action('sleep')">ŚPIJ</button>
            <button class="btn shop" onclick="toggleShop()">SKLEP</button>
        </nav>

        <div id="shop-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Sklep i Personalizacja</h2>
                <div class="shop-items">
                    <div class="item" onclick="buyItem('hat', 100)">Czapka (100 monet)</div>
                    <div class="item" onclick="buyItem('glasses', 250)">Okulary (250 monet)</div>
                    <div class="item" onclick="buyItem('skin_gold', 50, 'diamond')">Złoty kolor (50 diamentów)</div>
                </div>
                <button onclick="toggleShop()">Zamknij</button>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
