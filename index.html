<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vinted Business | Aro & Polak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen pb-20">

    <div id="app" class="p-4">
        <header class="mb-6 pt-4">
            <h1 class="text-2xl font-black text-green-500 uppercase tracking-wider">Aro & Polak Biznes</h1>
            <p class="text-gray-400 text-sm">Vinted Tracker v1.0</p>
        </header>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl">
                <p class="text-xs text-gray-400 uppercase">Łączny Zysk</p>
                <p class="text-xl font-bold text-green-400">{{ totalProfit }} zł</p>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl">
                <p class="text-xs text-gray-400 uppercase">Na głowę</p>
                <p class="text-xl font-bold text-blue-400">{{ (totalProfit / 2).toFixed(2) }} zł</p>
            </div>
        </div>

        <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl mb-8 shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Nowy Item</h2>
            <div class="space-y-3">
                <input v-model="newItem.name" type="text" placeholder="Co kupiłeś?" class="w-full bg-gray-800 border-none p-4 rounded-xl focus:ring-2 focus:ring-green-500 outline-none text-white">
                <div class="flex gap-2">
                    <input v-model.number="newItem.buy" type="number" placeholder="Kupno" class="w-1/2 bg-gray-800 border-none p-4 rounded-xl outline-none">
                    <input v-model.number="newItem.sell" type="number" placeholder="Sprzedaż" class="w-1/2 bg-gray-800 border-none p-4 rounded-xl outline-none">
                </div>
                <button @click="saveToFirebase" :disabled="loading" class="w-full bg-green-600 active:bg-green-700 py-4 rounded-xl font-bold uppercase mt-2 shadow-lg disabled:opacity-50">
                    {{ loading ? 'Zapisywanie...' : 'Dodaj do bazy' }}
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <h2 class="text-gray-400 font-bold uppercase text-sm tracking-widest px-1">Ostatnie Akcje</h2>
            
            <div v-for="item in sales" :key="item.id" class="bg-gray-900 border-l-4 border-green-500 p-4 rounded-r-xl flex justify-between items-center shadow-sm">
                <div>
                    <p class="font-bold text-white">{{ item.name }}</p>
                    <p class="text-xs text-gray-500">{{ item.date }}</p>
                </div>
                <div class="text-right">
                    <p class="text-green-400 font-bold">+{{ item.sell - item.buy }} zł</p>
                    <p class="text-[10px] text-gray-500">Marża: {{ (((item.sell - item.buy) / item.buy) * 100).toFixed(0) }}%</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCR4fwPjTKduaI56l61sj1dz7o1560JY5w",
            authDomain: "arek-918ae.firebaseapp.com",
            projectId: "arek-918ae",
            storageBucket: "arek-918ae.firebasestorage.app",
            messagingSenderId: "661615275552",
            appId: "1:661615275552:web:8ec18d85d7b4c0e6c05645",
            measurementId: "G-L9FEK2526Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const salesCol = collection(db, 'sales');

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    newItem: { name: '', buy: null, sell: null },
                    sales: [],
                    loading: false
                }
            },
            computed: {
                totalProfit() {
                    return this.sales.reduce((sum, s) => sum + (s.sell - s.buy), 0).toFixed(2);
                }
            },
            methods: {
                async saveToFirebase() {
                    if(!this.newItem.name || this.newItem.buy == null) return;
                    this.loading = true;
                    try {
                        await addDoc(salesCol, {
                            name: this.newItem.name,
                            buy: this.newItem.buy,
                            sell: this.newItem.sell,
                            createdAt: new Date()
                        });
                        this.newItem = { name: '', buy: null, sell: null };
                    } catch (e) {
                        alert("Błąd zapisu!");
                    }
                    this.loading = false;
                }
            },
            mounted() {
                // Automatyczne odświeżanie danych na żywo
                const q = query(salesCol, orderBy('createdAt', 'desc'));
                onSnapshot(q, (snapshot) => {
                    this.sales = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().createdAt?.toDate().toLocaleDateString() || 'Brak daty'
                    }));
                });
            }
        }).mount('#app');
    </script>
</body>
</html>
