<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasz Wirtualny Pupil</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="game-container">
        <div class="stats-bar">
            <div class="stat"><div class="fill hunger" id="hunger-fill"></div><span>Jedzenie</span></div>
            <div class="stat"><div class="fill energy" id="energy-fill"></div><span>Energia</span></div>
            <div class="stat"><div class="fill happy" id="happy-fill"></div><span>Szczęście</span></div>
        </div>

        <div class="top-info">
            <div class="level-badge">LVL <span id="level-val">1</span></div>
            <div class="currency">
                <span id="coins">500</span> 🪙 | <span id="gems">10</span> 💎
            </div>
        </div>

        <div class="room" id="room-bg">
            <div id="pet-container">
                <svg viewBox="0 0 200 200" class="pet-svg" id="pet-svg">
                    <circle cx="100" cy="120" r="60" fill="#FFD700" id="pet-body" /> <circle cx="80" cy="100" r="8" fill="black" /> <circle cx="120" cy="100" r="8" fill="black" /> <path d="M 80 140 Q 100 160 120 140" stroke="black" fill="transparent" stroke-width="3" /> <g id="clothing-layer"></g>
                </svg>
                <div class="pet-shadow"></div>
            </div>
        </div>

        <div class="actions">
            <button onclick="performAction('feed')" class="btn-action">Karm</button>
            <button onclick="performAction('wash')" class="btn-action">Myj</button>
            <button onclick="performAction('play')" class="btn-action">Graj</button>
            <button onclick="performAction('sleep')" class="btn-action">Śpij</button>
            <button onclick="toggleShop()" class="btn-action btn-shop">Sklep</button>
        </div>
    </div>

    <div id="shop-overlay" class="hidden">
        <div class="shop-content">
            <h2>Ekskluzywny Butik</h2>
            <div class="shop-grid" id="shop-items">
                </div>
            <button onclick="toggleShop()">Zamknij</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
