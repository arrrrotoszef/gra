<body>
<div class="container">

  <div id="menu">

    <input id="roomInput" placeholder="Kod pokoju">

firebase.initializeApp(firebaseConfig);

  { q: "Pizza czy burger?", a:["Pizza","Burger"] },
  { q: "Film czy serial?", a:["Film","Serial"] },
  { q: "Noc czy dzień?", a:["Noc","Dzień"] }
];

function createRoom() {
  room = Math.floor(Math.random()*10000).toString();
  player = "p1";
  db.ref("rooms/"+room).set({});
  start();
}

function joinRoom() {
  room = document.getElementById("roomInput").value;
  player = "p2";
  start();
}

function start() {
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("roomCode").innerText = "Pokój: "+room;
  loadQuestion();
}

function loadQuestion() {
  const q = questions[Math.floor(Math.random()*questions.length)];
  document.getElementById("question").innerText = q.q;

  const div = document.getElementById("choices");
  div.innerHTML = "";

  q.a.forEach(ans => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerText = ans;
    btn.onclick = () => sendAnswer(ans);
    div.appendChild(btn);
  });
}
