<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nasz Kotek 🐾</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f4f6f8;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    
    /* Pasek górny z poziomem i monetami */
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 15px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.2em;
      box-sizing: border-box;
    }
    .coins { color: #f57c00; }
    .level { color: #6a1b9a; }

    /* Nagłówek i imiona */
    h1 { margin: 15px 0 5px 0; color: #4a148c; font-size: 2em; }
    .player-info { color: #777; font-size: 0.9em; margin-bottom: 10px; }
    .btn-small { background: none; border: 1px solid #ab47bc; color: #ab47bc; border-radius: 8px; padding: 2px 8px; cursor: pointer; font-size: 0.8em; margin-left: 5px; }

    /* Kotek */
    #cat-container {
      font-size: 110px;
      margin: 10px 0;
      transition: transform 0.2s;
    }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-5deg); }
      75% { transform: translateX(10px) rotate(5deg); }
    }

    /* Paski potrzeb */
    .vital-stats {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 15px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    .stat-row {
      margin-bottom: 10px;
      text-align: left;
      font-size: 0.9em;
      font-weight: bold;
      color: #555;
    }
    .bar-bg {
      background-color: #eee;
      border-radius: 10px;
      height: 18px;
      width: 100%;
      margin-top: 5px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.4s ease, background-color 0.4s ease;
    }
    #bar-food { width: 100%; background-color: #8bc34a; }
    #bar-water { width: 100%; background-color: #29b6f6; }
    #bar-xp { width: 0%; background-color: #ab47bc; height: 10px; margin-top: 10px; border-radius: 5px; }

    /* Panele z przyciskami */
    .action-panel {
      width: 90%;
      max-width: 400px;
      margin-bottom: 10px;
    }
    .panel-title {
      font-size: 0.85em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    button.action-btn {
      padding: 10px 5px;
      font-size: 0.9em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    button.action-btn span { font-size: 1.4em; }
    button.action-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    button.action-btn:disabled { filter: grayscale(100%); opacity: 0.6; cursor: not-allowed; }

    .btn-earn { background-color: #ab47bc; }
    .btn-shop-food { background-color: #ff9800; }
    .btn-shop-water { background-color: #03a9f4; }

    #log {
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 0.85em;
      color: #666;
      background: white;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      max-width: 400px;
      width: 80%;
      font-weight: 500;
    }

    /* Modale (Okienka pop-up) */
    #name-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: white; padding: 30px; border-radius: 20px;
      text-align: center; width: 80%; max-width: 300px;
    }
    .modal-box input {
      width: 90%; padding: 12px; margin: 15px 0;
      border: 2px solid #ab47bc; border-radius: 10px;
      font-size: 1.1em; text-align: center; outline: none;
    }
    .modal-box button {
      background: #ab47bc; color: white; border: none;
      padding: 12px 25px; border-radius: 10px; font-size: 1.1em; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="name-modal">
    <div class="modal-box">
      <h2>Kim jesteś? 👋</h2>
      <p>Wpisz swoje imię (np. Arek lub Natalia):</p>
      <input type="text" id="player-name-input" placeholder="Twoje imię...">
      <button onclick="savePlayerName()">Zapisz</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="level"><span id="level-text">Kociak</span> <span style="font-size:0.7em" id="xp-text">(0 XP)</span></div>
    <div class="coins"><span id="coins-display">0</span> 🪙</div>
  </div>
  
  <h1 id="cat-name-display">Kotek</h1>
  <div class="player-info">
    Grasz jako: <strong id="current-player-display">Gość</strong> 
    <button class="btn-small" onclick="changeCatName()">Zmień imię kotka</button>
  </div>
  
  <div id="cat-container">🐱</div>
  
  <div class="vital-stats">
    <div class="stat-row">
      🍗 Najedzenie (<span id="food-text">100</span>%)
      <div class="bar-bg"><div id="bar-food" class="bar-fill"></div></div>
    </div>
    <div class="stat-row" style="margin-bottom: 0;">
      💧 Nawodnienie (<span id="water-text">100</span>%)
      <div class="bar-bg"><div id="bar-water" class="bar-fill"></div></div>
    </div>
    <div style="text-align: center; font-size: 0.8em; margin-top: 15px; color: #888;">Postęp do zmiany wyglądu:</div>
    <div class="bar-bg" style="height: 8px;"><div id="bar-xp" class="bar-fill"></div></div>
  </div>

  <div class="action-panel">
    <div class="panel-title">Zabawa (Zarabiaj Monety)</div>
    <div class="buttons-grid">
      <button class="action-btn btn-earn" id="btn-pet"><span>🐾</span> Głaskaj<br><small>+2🪙 / -10% Energii</small></button>
      <button class="action-btn btn-earn" id="btn-play"><span>🧶</span> Baw się<br><small>+5🪙 / -25% Energii</small></button>
    </div>
  </div>

  <div class="action-panel">
    <div class="panel-title">Sklep (Odnawiaj Potrzeby)</div>
    <div class="buttons-grid">
      <button class="action-btn btn-shop-food" id="btn-buy-food"><span>🐟</span> Kup Rybę<br><small>Koszt: 10🪙 (+40% 🍗)</small></button>
      <button class="action-btn btn-shop-water" id="btn-buy-water"><span>🥛</span> Kup Mleko<br><small>Koszt: 5🪙 (+40% 💧)</small></button>
    </div>
  </div>

  <div id="log">Witajcie w grze! 🐾</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // NOWA KONFIGURACJA FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyD8qaNZKjmenGo0MxL4dI7MYb2khcHSUes",
      authDomain: "graznatalia-e1b58.firebaseapp.com",
      projectId: "graznatalia-e1b58",
      storageBucket: "graznatalia-e1b58.firebasestorage.app",
      messagingSenderId: "265631462505",
      appId: "1:265631462505:web:40b3bb8c72908cf8461ef8",
      measurementId: "G-JWW9JW9TD0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // Używamy dokumentu o nazwie 'wspolny_kotek'
    const catDocRef = doc(db, "gra", "wspolny_kotek");

    let state = { catName: "Puszek", xp: 0, coins: 20, food: 100, water: 100, log: "Zaczynamy!" };
    
    // --- OBSŁUGA IMIENIA GRACZA (LOCAL STORAGE) ---
    let myName = localStorage.getItem("playerName");
    if (!myName) {
      document.getElementById("name-modal").style.display = "flex";
    } else {
      document.getElementById("current-player-display").innerText = myName;
    }

    window.savePlayerName = function() {
      const input = document.getElementById("player-name-input").value.trim();
      if(input) {
        myName = input;
        localStorage.setItem("playerName", myName);
        document.getElementById("current-player-display").innerText = myName;
        document.getElementById("name-modal").style.display = "none";
      }
    };

    // --- ZMIANA IMIENIA KOTKA ---
    window.changeCatName = async function() {
      const newName = prompt("Jak chcecie nazwać kotka?", state.catName);
      if (newName && newName.trim() !== "") {
        try {
          await updateDoc(catDocRef, { catName: newName.trim() });
        } catch(e) { console.error("Błąd zmiany imienia:", e); }
      }
    };

    // Fazy rozwoju
    const phases = [
      { min: 0, max: 49, emoji: "🐱", name: "Kociak" },
      { min: 50, max: 149, emoji: "🐈", name: "Kocur" },
      { min: 150, max: 399, emoji: "🐅", name: "Tygrys" },
      { min: 400, max: 99999, emoji: "🦁", name: "Lew" }
    ];

    function updateColor(barElement, value) {
      if(value > 50) barElement.style.backgroundColor = barElement.id === 'bar-food' ? '#8bc34a' : '#29b6f6';
      else if(value > 20) barElement.style.backgroundColor = '#ffeb3b';
      else barElement.style.backgroundColor = '#f44336';
    }

    // Nasłuchiwanie bazy
    onSnapshot(catDocRef, (docSnap) => {
      if (docSnap.exists()) {
        state = docSnap.data();
        
        // Aktualizacja interfejsu
        document.getElementById("cat-name-display").innerText = state.catName + " 🐾";
        document.getElementById("coins-display").innerText = state.coins;
        document.getElementById("xp-text").innerText = `(${state.xp} XP)`;
        
        // Paski
        document.getElementById("food-text").innerText = state.food;
        const foodBar = document.getElementById("bar-food");
        foodBar.style.width = state.food + "%";
        updateColor(foodBar, state.food);

        document.getElementById("water-text").innerText = state.water;
        const waterBar = document.getElementById("bar-water");
        waterBar.style.width = state.water + "%";
        updateColor(waterBar, state.water);

        // Animacja
        const catEl = document.getElementById("cat-container");
        catEl.classList.remove("shake");
        void catEl.offsetWidth; 
        catEl.classList.add("shake");

        // Poziom
        const currentPhase = phases.find(p => state.xp >= p.min && state.xp <= p.max) || phases[0];
        catEl.innerText = currentPhase.emoji;
        document.getElementById("level-text").innerText = currentPhase.name;

        let xpPercent = 100;
        if (currentPhase.max !== 99999) xpPercent = ((state.xp - currentPhase.min) / (currentPhase.max - currentPhase.min)) * 100;
        document.getElementById("bar-xp").style.width = xpPercent + "%";

        if(state.log) document.getElementById("log").innerText = state.log;

        // Włączanie/wyłączanie przycisków
        document.getElementById("btn-buy-food").disabled = state.coins < 10 || state.food >= 100;
        document.getElementById("btn-buy-water").disabled = state.coins < 5 || state.water >= 100;

      } else {
        // Nowa baza! Startowe dane
        setDoc(catDocRef, { catName: "Puszek", xp: 0, coins: 20, food: 100, water: 100, log: "Witajcie w nowym domku! 🐾" });
      }
    });

    // Główna funkcja akcji
    async function doAction(actionType) {
      if(!myName) return alert("Najpierw podaj swoje imię!");
      
      let { xp, coins, food, water, catName } = state;
      let logMsg = "";
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      if (actionType === 'pet') {
        if (food < 10 || water < 10) return alert(`${catName} jest zbyt głodny/spragniony!`);
        xp += 1; coins += 2; food -= 10; water -= 10;
        logMsg = `${myName} głaszcze kotka! (+2🪙) o ${time}`;
      } 
      else if (actionType === 'play') {
        if (food < 25 || water < 25) return alert(`${catName} opadł z sił, nakarm go!`);
        xp += 3; coins += 5; food -= 25; water -= 25;
        logMsg = `${myName} bawi się z kotkiem! (+5🪙) o ${time}`;
      }
      else if (actionType === 'buyFood') {
        if (coins < 10) return;
        coins -= 10; food += 40;
        logMsg = `${myName} kupuje rybkę! 🐟 o ${time}`;
      }
      else if (actionType === 'buyWater') {
        if (coins < 5) return;
        coins -= 5; water += 40;
        logMsg = `${myName} daje mleko! 🥛 o ${time}`;
      }

      food = Math.max(0, Math.min(100, food));
      water = Math.max(0, Math.min(100, water));

      try {
        await updateDoc(catDocRef, { xp, coins, food, water, log: logMsg });
      } catch (e) { console.error("Błąd zapisu:", e); }
    }

    document.getElementById("btn-pet").addEventListener("click", () => doAction('pet'));
    document.getElementById("btn-play").addEventListener("click", () => doAction('play'));
    document.getElementById("btn-buy-food").addEventListener("click", () => doAction('buyFood'));
    document.getElementById("btn-buy-water").addEventListener("click", () => doAction('buyWater'));
  </script>
</body>
</html>
