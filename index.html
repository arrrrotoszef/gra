<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasz Słodki Pingwinek 3D</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --glass: rgba(255, 255, 255, 0.2);
            --glass-heavy: rgba(255, 255, 255, 0.8);
            --accent: #6c5ce7;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #2d3436; }

        /* TŁA GRY */
        #main-bg {
            position: fixed; inset: 0; z-index: -1;
            transition: 1s ease;
            background: linear-gradient(180deg, #74b9ff 0%, #a29bfe 100%);
        }
        .bg-arctic { background: linear-gradient(180deg, #dff9fb 0%, #c7ecee 100%) !important; }
        .bg-forest { background: linear-gradient(180deg, #55efc4 0%, #00b894 100%) !important; }
        .bg-space { background: radial-gradient(circle, #2d3436 0%, #000000 100%) !important; }

        /* EKRAN STARTOWY */
        #login-screen {
            position: fixed; inset: 0; background: var(--accent); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }

        /* KONTENER GŁÓWNY */
        #app {
            width: 100%; max-width: 450px; height: 100vh; margin: 0 auto;
            display: flex; flex-direction: column; position: relative;
        }

        /* HEADER */
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.3); padding: 20px;
        }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .stat-box { background: rgba(0,0,0,0.1); border-radius: 12px; height: 8px; overflow: hidden; }
        .stat-fill { height: 100%; transition: 0.5s; box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* PINGWINEK 3D */
        .pet-stage {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #penguin-svg {
            width: 280px; height: 280px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.03) translateY(-10px); }
        }

        /* MODALE I PRZYCISKI */
        .bottom-nav {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            padding: 20px; background: var(--glass-heavy); border-radius: 30px 30px 0 0;
        }

        .btn {
            border: none; padding: 12px; border-radius: 15px; font-weight: 800;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-action { background: white; color: var(--accent); }
        .btn-action:hover { transform: translateY(-5px); background: var(--accent); color: white; }

        /* LISTY PRZEDMIOTÓW */
        .menu-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
            background: white; border-radius: 30px 30px 0 0; z-index: 500;
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            padding: 25px; overflow-y: auto;
        }
        .menu-overlay.active { transform: translateY(0); }

        .item-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { 
            background: #f8f9fa; border-radius: 20px; padding: 15px; text-align: center;
            border: 2px solid transparent; cursor: pointer;
        }
        .card:hover { border-color: var(--accent); }

        input { padding: 15px; border-radius: 10px; border: none; width: 80%; margin: 10px; font-size: 16px; }

    </style>
</head>
<body>

<div id="main-bg"></div>

<div id="login-screen">
    <h1 style="font-weight: 800;">Nasz Pingwinek 🐧</h1>
    <input type="text" id="in-name1" placeholder="Twoje imię...">
    <input type="text" id="in-name2" placeholder="Imię dziewczyny...">
    <input type="text" id="in-petname" placeholder="Jak nazwiemy pingwina?">
    <button class="btn" style="background:white; color:var(--accent); padding:15px 40px;" onclick="saveProfile()">START</button>
</div>

<div id="app">
    <div class="glass-panel">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <div>
                <small id="ui-players" style="opacity: 0.8;"></small>
                <h2 id="ui-petname" style="margin:0; font-weight: 800;">Bąbel</h2>
            </div>
            <div style="text-align: right;">
                <span style="font-size: 20px;">🪙 <span id="ui-coins">0</span></span><br>
                <small>LVL <span id="ui-lvl">1</span></small>
            </div>
        </div>
        <div class="stats-bar">
            <div class="stat-box"><div id="bar-hunger" class="stat-fill" style="background:#ff7675;"></div></div>
            <div class="stat-box"><div id="bar-energy" class="stat-fill" style="background:#fdcb6e;"></div></div>
            <div class="stat-box"><div id="bar-happy" class="stat-fill" style="background:#55efc4;"></div></div>
        </div>
    </div>

    <div class="pet-stage">
        <svg id="penguin-svg" viewBox="0 0 200 200">
            <defs>
                <radialGradient id="bodyGrad" cx="50%" cy="40%" r="50%">
                    <stop offset="0%" style="stop-color:#4b4b4b" />
                    <stop offset="100%" style="stop-color:#1e272e" />
                </radialGradient>
                <radialGradient id="bellyGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#ffffff" />
                    <stop offset="100%" style="stop-color:#f1f2f6" />
                </radialGradient>
            </defs>
            
            <ellipse cx="100" cy="185" rx="50" ry="10" fill="rgba(0,0,0,0.2)" />

            <ellipse cx="45" cy="120" rx="15" ry="35" fill="#1e272e" transform="rotate(15 45 120)" />
            <ellipse cx="155" cy="120" rx="15" ry="35" fill="#1e272e" transform="rotate(-15 155 120)" />

            <path d="M50,120 Q50,40 100,40 Q150,40 150,120 Q150,180 100,180 Q50,180 50,120" fill="url(#bodyGrad)" />
            
            <path d="M65,130 Q65,80 100,80 Q135,80 135,130 Q135,170 100,170 Q65,170 65,130" fill="url(#bellyGrad)" />

            <g id="eyes">
                <circle cx="80" cy="90" r="8" fill="#2d3436" />
                <circle cx="78" cy="88" r="3" fill="white" /> <circle cx="120" cy="90" r="8" fill="#2d3436" />
                <circle cx="118" cy="88" r="3" fill="white" />
            </g>

            <path d="M90,105 L110,105 L100,120 Z" fill="#ffa502" />
            <path d="M90,105 Q100,102 110,105" fill="#e67e22" />

            <ellipse cx="80" cy="178" rx="12" ry="6" fill="#ffa502" />
            <ellipse cx="120" cy="178" rx="12" ry="6" fill="#ffa502" />

            <g id="layer-hat"></g>
            <g id="layer-neck"></g>
            <g id="layer-eyes"></g>
        </svg>
    </div>

    <div class="bottom-nav">
        <button class="btn btn-action" onclick="toggleMenu('food')">JEŚĆ</button>
        <button class="btn btn-action" onclick="toggleMenu('clothes')">STYL</button>
        <button class="btn btn-action" onclick="toggleMenu('bgs')">ŚWIAT</button>
        <button class="btn btn-action" style="background:var(--accent); color:white" onclick="toggleMenu('games')">GRY</button>
    </div>

    <div id="m-food" class="menu-overlay">
        <h3>🛒 Restauracja</h3>
        <div class="item-grid" id="list-food"></div>
        <button class="btn btn-action" style="width:100%; margin-top:20px" onclick="toggleMenu()">ZAMKNIJ</button>
    </div>

    <div id="m-clothes" class="menu-overlay">
        <h3>👗 Butik PRO</h3>
        <div class="item-grid" id="list-clothes"></div>
        <button class="btn btn-action" style="width:100%; margin-top:20px" onclick="toggleMenu()">ZAMKNIJ</button>
    </div>

    <div id="m-bgs" class="menu-overlay">
        <h3>🌍 Zmień Świat</h3>
        <div class="item-grid" id="list-bgs"></div>
        <button class="btn btn-action" style="width:100%; margin-top:20px" onclick="toggleMenu()">ZAMKNIJ</button>
    </div>

    <div id="m-games" class="menu-overlay">
        <h3>🎮 Mini Gry (Zarabiaj!)</h3>
        <div class="item-grid">
            <div class="card" onclick="alert('Gra 1: Zbieranie rybek')">🐟 Rybki</div>
            <div class="card" onclick="alert('Gra 2: Skok przez krę')">🧊 Lodowiec</div>
            <div class="card" onclick="alert('Gra 3: Refleks')">⚡ Piorun</div>
            <div class="card" onclick="alert('Gra 4: Quiz')">❓ Wiedza</div>
            <div class="card" onclick="alert('Gra 5: Ping-Pong')">🏓 Pong</div>
        </div>
    </div>
</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyD8qaNZKjmenGo0MxL4dI7MYb2khcHSUes",
    authDomain: "graznatalia-e1b58.firebaseapp.com",
    projectId: "graznatalia-e1b58",
    storageBucket: "graznatalia-e1b58.firebasestorage.app",
    messagingSenderId: "265631462505",
    appId: "1:265631462505:web:40b3bb8c72908cf8461ef8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("pingwin_pro").doc("shared_save");

let state = {
    hunger: 100, energy: 100, happy: 100, coins: 1000, lvl: 1, xp: 0,
    p1: "Gracz 1", p2: "Gracz 2", petName: "Bąbel",
    bg: 'default',
    outfit: { hat: '', neck: '', eyes: '' }
};

// --- START I PROFILE ---
function saveProfile() {
    const p1 = document.getElementById('in-name1').value || "On";
    const p2 = document.getElementById('in-name2').value || "Ona";
    const pn = document.getElementById('in-petname').value || "Pingwinek";
    
    state.p1 = p1; state.p2 = p2; state.petName = pn;
    docRef.set(state).then(() => {
        document.getElementById('login-screen').style.display = 'none';
    });
}

// --- SYNCHRONIZACJA ---
docRef.onSnapshot(doc => {
    if(doc.exists) {
        state = doc.data();
        updateUI();
        document.getElementById('login-screen').style.display = 'none';
    }
});

function updateUI() {
    document.getElementById('bar-hunger').style.width = state.hunger + '%';
    document.getElementById('bar-energy').style.width = state.energy + '%';
    document.getElementById('bar-happy').style.width = state.happy + '%';
    document.getElementById('ui-coins').innerText = state.coins;
    document.getElementById('ui-lvl').innerText = state.lvl;
    document.getElementById('ui-petname').innerText = state.petName;
    document.getElementById('ui-players').innerText = `${state.p1} ❤️ ${state.p2}`;

    // Tło
    const bg = document.getElementById('main-bg');
    bg.className = '';
    if(state.bg !== 'default') bg.classList.add('bg-' + state.bg);

    // Ubrania
    document.getElementById('layer-hat').innerHTML = state.outfit.hat || '';
    document.getElementById('layer-neck').innerHTML = state.outfit.neck || '';
    document.getElementById('layer-eyes').innerHTML = state.outfit.eyes || '';
}

// --- SKLEPY ---
const ITEMS = {
    food: [
        {n: 'Rybka', c: 10, v: 15}, {n: 'Krewetka', c: 25, v: 30}, {n: 'Lody', c: 50, v: 50}
    ],
    clothes: [
        {id: 'crown', n: 'Złota Korona', c: 500, l: 'hat', svg: '<path d="M70,45 L85,15 L100,40 L115,15 L130,45 Z" fill="#f1c40f" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))"/>'},
        {id: 'tie', n: 'Czerwona Mucha', c: 150, l: 'neck', svg: '<path d="M85,145 L115,145 L100,135 Z" fill="#e74c3c"/>'},
        {id: 'cool', n: 'Okulary VIP', c: 300, l: 'eyes', svg: '<rect x="65" y="85" width="70" height="12" rx="3" fill="black" opacity="0.9"/>'}
    ],
    bgs: [
        {id: 'arctic', n: 'Arktyka', c: 200}, {id: 'forest', n: 'Las', c: 400}, {id: 'space', n: 'Kosmos', c: 1000}
    ]
};

function renderLists() {
    document.getElementById('list-food').innerHTML = ITEMS.food.map(i => `<div class="card" onclick="buyFood(${i.v}, ${i.c})">${i.n}<br><b>${i.c} 🪙</b></div>`).join('');
    document.getElementById('list-clothes').innerHTML = ITEMS.clothes.map(i => `<div class="card" onclick="buyCloth('${i.id}')">${i.n}<br><b>${i.c} 🪙</b></div>`).join('') + `<div class="card" onclick="buyCloth('none')">Zdejmij</div>`;
    document.getElementById('list-bgs').innerHTML = ITEMS.bgs.map(i => `<div class="card" onclick="buyBg('${i.id}', ${i.c})">${i.n}<br><b>${i.c} 🪙</b></div>`).join('');
}

async function buyFood(v, c) {
    if(state.coins >= c) {
        await docRef.update({ hunger: Math.min(100, state.hunger + v), coins: state.coins - c });
    }
}

async function buyCloth(id) {
    if(id === 'none') {
        await docRef.update({ outfit: {hat:'', neck:'', eyes:''} });
        return;
    }
    const item = ITEMS.clothes.find(x => x.id === id);
    if(state.coins >= item.c) {
        let o = {...state.outfit}; o[item.l] = item.svg;
        await docRef.update({ outfit: o, coins: state.coins - item.c });
    }
}

async function buyBg(id, c) {
    if(state.coins >= c) {
        await docRef.update({ bg: id, coins: state.coins - c });
    }
}

function toggleMenu(m) {
    document.querySelectorAll('.menu-overlay').forEach(el => el.classList.remove('active'));
    if(m) {
        document.getElementById('m-' + m).classList.add('active');
        renderLists();
    }
}

// Spadek statystyk co minutę
setInterval(() => {
    docRef.update({
        hunger: Math.max(0, state.hunger - 1),
        energy: Math.max(0, state.energy - 1)
    });
}, 60000);
</script>
</body>
</html>
