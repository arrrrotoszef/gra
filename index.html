<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nasz Pengu ❤️</title>
  <style>
    /* Stylowanie pod telefony komórkowe */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); /* Ładne, pastelowe tło */
      color: #333; 
      text-align: center; 
      overflow: hidden;
    }
    h1 {
      font-size: 28px;
      color: #4a4a4a;
      margin-bottom: 10px;
    }
    .pengu-container {
      position: relative;
      margin: 40px 0;
    }
    .pengu { 
      font-size: 120px; 
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      user-select: none;
    }
    /* Animacja podskoku, gdy ktoś kliknie przycisk */
    .pengu.happy { 
      transform: scale(1.3) translateY(-20px); 
    }
    button { 
      padding: 18px 40px; 
      font-size: 20px; 
      font-weight: bold;
      border: none; 
      border-radius: 30px; 
      background-color: #ff758c; 
      color: white; 
      cursor: pointer; 
      box-shadow: 0 8px 15px rgba(255, 117, 140, 0.4); 
      transition: all 0.3s ease 0s;
    }
    button:active { 
      transform: translateY(4px); 
      box-shadow: 0 4px 6px rgba(255, 117, 140, 0.4); 
    }
    #stats { 
      margin-top: 30px; 
      font-size: 22px; 
      font-weight: bold; 
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Nasz Wirtualny Pengu</h1>
  
  <div class="pengu-container">
    <div id="pengu" class="pengu">🐧</div>
  </div>
  
  <button id="feedBtn">Nakarm Pengu!</button>
  
  <div id="stats">
    Zjadł rybek: <span id="feedCount">...</span> 🐟
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Twoja konfiguracja Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD8qaNZKjmenGo0MxL4dI7MYb2khcHSUes",
      authDomain: "graznatalia-e1b58.firebaseapp.com",
      projectId: "graznatalia-e1b58",
      storageBucket: "graznatalia-e1b58.firebasestorage.app",
      messagingSenderId: "265631462505",
      appId: "1:265631462505:web:40b3bb8c72908cf8461ef8",
      measurementId: "G-JWW9JW9TD0"
    };

    // Inicjalizacja aplikacji i bazy danych
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Tworzymy referencję do jednego konkretnego dokumentu w bazie (wspólnego dla Was)
    const penguRef = doc(db, "gameData", "sharedPengu");

    // Pobieranie elementów z HTML
    const penguEl = document.getElementById('pengu');
    const countEl = document.getElementById('feedCount');
    const feedBtn = document.getElementById('feedBtn');

    let initialLoad = true;

    // Nasłuchiwanie zmian w bazie danych W CZASIE RZECZYWISTYM
    onSnapshot(penguRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        countEl.innerText = data.feeds || 0;
        
        // Jeśli to nie jest pierwsze załadowanie strony, odtwórz animację (bo ktoś właśnie nakarmił)
        if (!initialLoad) {
          penguEl.classList.add('happy');
          setTimeout(() => penguEl.classList.remove('happy'), 400); // Animacja trwa 0.4 sekundy
        }
        initialLoad = false;
      } else {
        // Jeśli dokument nie istnieje (pierwsze uruchomienie w historii), stwórz go
        setDoc(penguRef, { feeds: 0 });
      }
    });

    // Obsługa kliknięcia przycisku
    feedBtn.addEventListener('click', async () => {
      // Sama animacja lokalna po kliknięciu
      penguEl.classList.add('happy');
      setTimeout(() => penguEl.classList.remove('happy'), 400);

      // Aktualizacja danych w Firebase
      try {
        await updateDoc(penguRef, {
          feeds: increment(1) // Bezpiecznie zwiększa wartość o 1
        });
      } catch (err) {
        // Jeśli z jakiegoś powodu dokumentu by nie było, tworzymy go na nowo z wartością 1
        await setDoc(penguRef, { feeds: 1 });
      }
    });
  </script>
</body>
</html>
