<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nasz Słodki Kotek V7 🐾</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
    :root { --primary: #0984e3; --bg: #dfe6e9; --panel: rgba(255, 255, 255, 0.95); --text: #2d3436; }
    body { font-family: 'Nunito', sans-serif; text-align: center; background-color: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text); user-select: none; transition: background 0.5s ease;}
    
    /* Dynamiczne Tła (Kupowane) */
    body.bg-default { background: linear-gradient(135deg, #dfe6e9, #b2bec3); }
    body.bg-room { background: linear-gradient(135deg, #ffeaa7, #fab1a0); }
    body.bg-park { background: linear-gradient(135deg, #55efc4, #00b894); }
    body.bg-space { background: linear-gradient(135deg, #192a56, #273c75); color: white; }
    body.bg-space .panel { background: rgba(0, 0, 0, 0.7); color: white; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);}
    body.bg-space .bar-wrap { color: #dcdde1; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 95%; max-width: 450px; background: var(--panel); padding: 15px 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-top: 5px; box-sizing: border-box; position: relative; z-index: 10; transition: all 0.5s;}
    .lvl-box { font-size: 1.2em; font-weight: 900; display: flex; flex-direction: column; align-items: flex-start;}
    .lvl-title { color: #e84393; font-size: 1.2em;}
    .xp-text { font-size: 0.7em; color: #636e72; }
    .coins-box { color: #f39c12; font-size: 1.6em; font-weight: 900; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);}
    
    .name-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; background: var(--panel); padding: 5px 20px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    h1 { margin: 0; color: #0984e3; font-size: 2em; }
    .btn-edit { background: none; border: none; font-size: 1.5em; cursor: pointer; transition: transform 0.1s;}
    .btn-edit:active { transform: scale(0.8); }

    /* ORGANICZNY KOTEK (Nie koła!) */
    #cat-stage { width: 320px; height: 320px; margin: 10px 0; position: relative; display: flex; align-items: center; justify-content: center; }
    #animated-cat { width: 100%; height: 100%; animation: breathe 3.5s infinite ease-in-out; z-index: 2; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2)); }
    
    @keyframes breathe { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.02) translateY(-8px); } }
    @keyframes blink { 0%, 4%, 100% { transform: scaleY(1); } 2% { transform: scaleY(0.1); } }
    @keyframes tailWag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-15deg); } }
    .eyes { animation: blink 4s infinite; transform-origin: center; }
    .tail { animation: tailWag 3s ease-in-out infinite; transform-origin: 65% 85%; }
    .happy-anim { animation: happy 0.5s ease; }
    @keyframes happy { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }

    /* UI Panels */
    .panel { width: 95%; max-width: 450px; background: var(--panel); padding: 15px; border-radius: 20px; box-shadow: 0 8px 15px rgba(0,0,0,0.08); margin-bottom: 15px; box-sizing: border-box; backdrop-filter: blur(5px);}
    .bar-wrap { margin-bottom: 5px; text-align: left; font-size: 0.9em; font-weight: 900; color: #555; }
    .bar-bg { background-color: rgba(0,0,0,0.1); border-radius: 12px; height: 16px; width: 100%; margin-top: 5px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);}
    .bar-fill { height: 100%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    #bar-food { background: linear-gradient(90deg, #00b894, #55efc4); }
    #bar-xp { background: linear-gradient(90deg, #e84393, #fd79a8); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn-big { padding: 15px 5px; font-size: 1.1em; border: none; border-radius: 15px; cursor: pointer; color: white; font-weight: 900; font-family: 'Nunito', sans-serif; box-shadow: 0 6px 0 rgba(0,0,0,0.2); transition: all 0.1s; display: flex; flex-direction: column; align-items: center; justify-content: center;}
    button.btn-big span.icon { font-size: 1.8em; margin-bottom: 5px; }
    button.btn-big:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.2); }
    button:disabled { filter: grayscale(100%); opacity: 0.6; cursor: not-allowed; }
    
    .btn-pet { background-color: #ff7675; }
    .btn-feed { background-color: #00b894; }
    .btn-game-flappy { background-color: #fdcb6e; color: #2d3436; width: 100%; margin-top: 10px;}

    /* Sklep System */
    .shop-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto;}
    .shop-tab { flex: 1; padding: 10px; font-size: 0.9em; background: rgba(0,0,0,0.1); font-weight: 900; border-radius: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s;}
    .shop-tab.active { background: #0984e3; color: white; box-shadow: 0 4px 10px rgba(9, 132, 227, 0.4);}
    
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; max-height: 250px; overflow-y: auto; padding: 5px; }
    .shop-item { background: rgba(255,255,255,0.8); border-radius: 15px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); color: #2d3436;}
    body.bg-space .shop-item { background: rgba(255,255,255,0.1); color: white;}
    .shop-icon { width: 50px; height: 50px; margin-bottom: 5px; }
    .shop-btn { width: 95%; padding: 8px 0; font-weight: 900; font-family: 'Nunito'; border-radius: 8px; border: none; cursor: pointer; margin-top: auto; color: white; transition: 0.2s;}
    .shop-btn.buy { background-color: #00cec9; }
    .shop-btn.equip { background-color: #0984e3; }
    .shop-btn.equipped { background-color: #b2bec3; box-shadow: inset 0 3px 5px rgba(0,0,0,0.1); }

    /* Modale */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; }
    .modal-content { background: white; color: #2d3436; padding: 30px; border-radius: 25px; text-align: center; max-width: 350px; width: 85%; }
    .modal-content h2 { color: #e84393; font-size: 2em; margin-top: 0; }
    .modal-btn { background: #0984e3; color: white; padding: 15px 30px; border-radius: 15px; font-size: 1.2em; font-weight: 900; border: none; margin-top: 20px; cursor: pointer; width: 100%; box-shadow: 0 4px 0 #0764ab;}
    .modal-btn:active { transform: translateY(4px); box-shadow: none; }
    
    /* Minigames */
    canvas#flappy { background: linear-gradient(180deg, #74b9ff, #0984e3); border-radius: 20px; border: 5px solid white; display: block; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
    .game-hud { position: absolute; top: 30px; font-size: 2.5em; font-weight: 900; color: white; text-shadow: 2px 2px 0 #000; z-index: 10;}
  </style>
</head>
<body class="bg-default">

  <div class="panel">
    <div class="bar-wrap">🍗 Energia Brzuszka
      <div class="bar-bg"><div id="bar-food" class="bar-fill" style="width: 100%;"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="grid-2">
      <button class="btn-big btn-pet" onclick="doAction('pet')" id="btn-pet"><span class="icon">🐾</span>Zabawa<br><small>+10 XP</small></button>
      <button class="btn-big btn-feed" onclick="doAction('feed')" id="btn-feed"><span class="icon">🐟</span>Nakarm<br><small>10 🪙 / +5 XP</small></button>

    <button class="btn-big btn-game-flappy" onclick="openFlappy()"><span class="icon">🦅</span>Graj w Flappy Cat (Zarabiaj 🪙)</button>

  <div class="panel">
    <div class="shop-tabs">
      <div class="shop-tab active" onclick="switchTab('hats')">Czapki</div>
      <div class="shop-tab" onclick="switchTab('clothes')">Bluzy</div>
      <div class="shop-tab" onclick="switchTab('glasses')">Okulary</div>
      <div class="shop-tab" onclick="switchTab('bgs')">Tła</div>

  <div id="modal-levelup" class="modal">
    <div class="modal-content">
      <h2>🎉 Nowy Poziom! 🎉</h2>
      <div style="font-size: 5em; margin: 10px 0; color: #fdcb6e;">⭐<span id="lvl-up-num">2</span></div>

  <div id="modal-flappy" class="modal">
    <div class="game-hud" id="flappy-score">0</div>
    <canvas id="flappy" width="320" height="450"></canvas>
    <div style="margin-top: 15px; font-weight: bold; font-size:1.2em;">Klikaj, by lecieć!</div>
    <button class="modal-btn" style="width: 90%; max-width: 320px; background: #d63031; box-shadow: 0 4px 0 #b02324;" onclick="closeFlappy()">Zakończ i Odbierz 🪙</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8qaNZKjmenGo0MxL4dI7MYb2khcHSUes",
      authDomain: "graznatalia-e1b58.firebaseapp.com",
      projectId: "graznatalia-e1b58",
      storageBucket: "graznatalia-e1b58.firebasestorage.app",
      messagingSenderId: "265631462505",
      appId: "1:265631462505:web:40b3bb8c72908cf8461ef8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const catDocRef = doc(db, "gra", "wspolny_kotek_v7"); // V7 ULTIMATE!

    // Baza Sklepu z ikonami wektorowymi SVG
    const svgIcons = {
        none: `<svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="#ff7675" stroke-width="4"/><line x1="10" y1="10" x2="40" y2="40" stroke="#ff7675" stroke-width="4"/></svg>`,
        hat_nike: `<svg viewBox="0 0 50 50"><path d="M10 30 Q25 10 40 30 Z" fill="#0984e3"/><path d="M35 30 Q45 28 45 35" stroke="#74b9ff" stroke-width="4" fill="none"/><path d="M 20 22 Q 18 25 15 22 Q 15 18 22 15 Q 18 20 20 22 Z" fill="white"/></svg>`,
        crown: `<svg viewBox="0 0 50 50"><path d="M10 40 L10 15 L20 25 L25 10 L30 25 L40 15 L40 40 Z" fill="#f1c40f"/></svg>`,
        hoodie: `<svg viewBox="0 0 50 50"><path d="M 10 45 C 5 25 15 10 25 10 C 35 10 45 25 40 45 Z" fill="#2d3436"/><path d="M 22 25 Q 18 28 15 25 Q 15 22 25 20 Q 20 25 22 25 Z" fill="white"/></svg>`,
        sweater: `<svg viewBox="0 0 50 50"><path d="M 10 45 C 5 25 15 10 25 10 C 35 10 45 25 40 45 Z" fill="#0984e3"/><line x1="10" y1="30" x2="40" y2="30" stroke="#74b9ff" stroke-width="3" stroke-dasharray="4 2"/></svg>`,
        glasses_pro: `<svg viewBox="0 0 50 50"><rect x="5" y="20" width="15" height="10" fill="#2d3436"/><rect x="30" y="20" width="15" height="10" fill="#2d3436"/><line x1="20" y1="25" x2="30" y2="25" stroke="#2d3436" stroke-width="2"/></svg>`,
        bg_room: `<svg viewBox="0 0 50 50"><rect x="5" y="5" width="40" height="40" fill="#ffeaa7"/><path d="M15 45 L15 30 L35 30 L35 45" fill="#fab1a0"/></svg>`,
        bg_park: `<svg viewBox="0 0 50 50"><rect x="5" y="5" width="40" height="40" fill="#55efc4"/><circle cx="25" cy="20" r="10" fill="#00b894"/><rect x="23" y="30" width="4" height="15" fill="#8e44ad"/></svg>`,
        bg_space: `<svg viewBox="0 0 50 50"><rect x="5" y="5" width="40" height="40" fill="#192a56"/><circle cx="15" cy="15" r="2" fill="white"/><circle cx="35" cy="25" r="1.5" fill="white"/><circle cx="20" cy="35" r="5" fill="#f1c40f"/></svg>`
    };

    const shopDB = {
      hats: [
        { id: 'none', name: 'Brak', price: 0, icon: svgIcons.none },
        { id: 'nike', name: 'Nike Cap', price: 50, icon: svgIcons.hat_nike },
        { id: 'crown', name: 'Korona Króla', price: 150, icon: svgIcons.crown }
      ],
      clothes: [
        { id: 'none', name: 'Brak', price: 0, icon: svgIcons.none },
        { id: 'hoodie_nike', name: 'Nike Hoodie', price: 60, icon: svgIcons.hoodie },
        { id: 'sweater_blue', name: 'Sweter', price: 80, icon: svgIcons.sweater }
      ],
      glasses: [
        { id: 'none', name: 'Brak', price: 0, icon: svgIcons.none },
        { id: 'pro', name: 'Pro Okulary', price: 40, icon: svgIcons.glasses_pro }
      ],
      bgs: [
        { id: 'default', name: 'Puste Tło', price: 0, icon: svgIcons.none },
        { id: 'room', name: 'Pokój', price: 100, icon: svgIcons.bg_room },
        { id: 'park', name: 'Park', price: 80, icon: svgIcons.bg_park },
        { id: 'space', name: 'Kosmos', price: 200, icon: svgIcons.bg_space }
      ]
    };

    let currentTab = 'hats';
    let state = { 
        catName: "Puszek", level: 1, xp: 0, coins: 100, food: 100, 
        inventory: ['hats_none', 'clothes_none', 'glasses_none', 'bgs_default'], 
        equipped: { hats: 'none', clothes: 'none', glasses: 'none', bgs: 'default' } 
    };
    
    function getXpForNextLevel(lvl) { return lvl * 50; }

    // --- RENDER SKLEPU ---
    window.switchTab = function(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderShop();
    }

    function renderShop() {
      const container = document.getElementById("shop-container");
      container.innerHTML = "";
      
      shopDB[currentTab].forEach(item => {
        const globalId = `${currentTab}_${item.id}`;
        const isOwned = state.inventory.includes(globalId);
        const isEquipped = state.equipped[currentTab] === item.id;
        
        let btnHTML = isEquipped ? `<button class="shop-btn equipped" disabled>Używane</button>` 
                    : isOwned ? `<button class="shop-btn equip" onclick="equipItem('${currentTab}', '${item.id}')">Użyj</button>` 
                    : `<button class="shop-btn buy" onclick="buyItem('${currentTab}', '${item.id}', ${item.price})" ${state.coins < item.price ? 'disabled' : ''}>Kup (${item.price}🪙)</button>`;

        container.innerHTML += `
          <div class="shop-item">
            <div class="shop-icon">${item.icon}</div>
            <div style="font-size:0.85em; font-weight:bold; margin-bottom:5px; text-align:center;">${item.name}</div>
            ${btnHTML}
          </div>
        `;
      });
    }

    // --- SYNCHRONIZACJA Z BAZĄ ---
    onSnapshot(catDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const oldLvl = state.level;
        state = docSnap.data();
        
        if(!state.inventory) state.inventory = ['hats_none', 'clothes_none', 'glasses_none', 'bgs_default'];
        if(!state.equipped) state.equipped = { hats: 'none', clothes: 'none', glasses: 'none', bgs: 'default' };

        document.getElementById("cat-name-display").innerText = state.catName;
        document.getElementById("lvl-display").innerText = state.level;
        document.getElementById("coins-display").innerText = state.coins;
        document.getElementById("xp-current").innerText = state.xp;
        
        const xpNeeded = getXpForNextLevel(state.level);
        document.getElementById("xp-needed").innerText = xpNeeded;
        document.getElementById("bar-xp").style.width = ((state.xp / xpNeeded) * 100) + "%";
        document.getElementById("bar-food").style.width = state.food + "%";

        // Blokada przycisków
        document.getElementById("btn-feed").disabled = state.coins < 10 || state.food >= 100;
        document.getElementById("btn-pet").disabled = state.food <= 10;

        // Level Up Wykrycie
        if(state.level > oldLvl && oldLvl !== undefined) {
            document.getElementById('lvl-up-num').innerText = state.level;
            let rewardMsg = "+50 Monet! 🪙";
            if(state.level === 3) { rewardMsg = "Nowa Czapka w Sklepie! 🧢"; state.inventory.push("hats_nike"); }
            if(state.level === 4) rewardMsg = "+100 Monet! 🪙";
            
            document.getElementById('lvl-up-reward').innerText = rewardMsg;
            document.getElementById('modal-levelup').style.display = 'flex';
        }

        applyEquipment();
        renderShop(); 
      } else {
        setDoc(catDocRef, state);
      }
    });

    function applyEquipment() {
        // Tło
        document.body.className = `bg-${state.equipped.bgs}`;

        // Ukryj wszystkie wektory ubrań
        ['cloth-hat_nike', 'cloth-hat_crown', 'cloth-hoodie_nike', 'cloth-sweater_blue', 'cloth-glasses_pro'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.style.display = "none";
        });

        // Pokazuj wybrane
        if(state.equipped.hats !== 'none') document.getElementById(`cloth-hat_${state.equipped.hats}`).style.display = "block";
        if(state.equipped.clothes !== 'none') document.getElementById(`cloth-${state.equipped.clothes}`).style.display = "block";
        if(state.equipped.glasses !== 'none') document.getElementById(`cloth-glasses_${state.equipped.glasses}`).style.display = "block";
    }

    window.changeCatName = async function() {
        const newName = prompt("Zmień imię kotka:", state.catName);
        if(newName && newName.trim()) await updateDoc(catDocRef, { catName: newName.trim() });
    }

    window.buyItem = async function(cat, id, price) {
        const gId = `${cat}_${id}`;
        if(state.coins >= price && !state.inventory.includes(gId)) {
            await updateDoc(catDocRef, { coins: state.coins - price, inventory: [...state.inventory, gId] });
        }
    }
    window.equipItem = async function(cat, id) {
        let newEq = { ...state.equipped }; newEq[cat] = id;
        await updateDoc(catDocRef, { equipped: newEq });
    }

    window.doAction = async function(type) {
      let { xp, level, coins, food } = state;

      if (type === 'pet') {
        if (food <= 10) return;
        xp += 10; food -= 15;
        document.getElementById("animated-cat").classList.add("happy-anim");
        setTimeout(() => document.getElementById("animated-cat").classList.remove("happy-anim"), 500);
      } else if (type === 'feed') {
        if (coins < 10) return;
        coins -= 10; food += 40; xp += 5;
      }

      // Awans
      let xpNeeded = getXpForNextLevel(level);
      if (xp >= xpNeeded) {
        level++; xp = 0; 
        coins += (level === 4) ? 100 : 50; 
      }

      food = Math.min(100, Math.max(0, food));
      await updateDoc(catDocRef, { xp, level, coins, food });
    }

    // --- UŁATWIONY FLAPPY CAT (MINIGRA) ---
    let flappyFrame, flappyScore = 0, catY = 200, catV = 0, pipes = [], gameActive = false;
    const canvas = document.getElementById("flappy"), ctx = canvas.getContext("2d");

    window.openFlappy = function() {
        document.getElementById('modal-flappy').style.display = 'flex';
        catY = 200; catV = 0; pipes = []; flappyScore = 0; gameActive = true;
        document.getElementById('flappy-score').innerText = 0;
        flappyLoop();
    }
    
    // Sterowanie
    document.getElementById('modal-flappy').addEventListener('touchstart', jump);
    document.getElementById('modal-flappy').addEventListener('mousedown', jump);
    function jump(e) { if(gameActive && e.target.tagName !== 'BUTTON') catV = -5; } // Mniejszy skok

    function drawFlappyCat(x, y) {
        // Narysujemy prostego kota w locie
        ctx.fillStyle = "#b2bec3";
        ctx.beginPath(); ctx.ellipse(x+20, y+15, 20, 15, 0, 0, Math.PI*2); ctx.fill(); // Ciało
        ctx.beginPath(); ctx.arc(x+35, y+10, 12, 0, Math.PI*2); ctx.fill(); // Głowa
        ctx.beginPath(); ctx.moveTo(x+30, y); ctx.lineTo(x+35, y-10); ctx.lineTo(x+40, y); ctx.fill(); // Ucho
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(x+40, y+8, 4, 0, Math.PI*2); ctx.fill(); // Oko
        ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(x+41, y+8, 1.5, 0, Math.PI*2); ctx.fill(); // Źrenica
        ctx.strokeStyle = "#b2bec3"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y+15); ctx.lineTo(x-15, y+10); ctx.stroke(); // Ogon
    }

    function flappyLoop() {
        if(!gameActive) return;
        ctx.clearRect(0,0,320,450);
        
        // Zmniejszona grawitacja dla ułatwienia
        catV += 0.15; catY += catV; 
        
        drawFlappyCat(40, catY);

        // Generowanie rur rzadziej
        if(frames % 120 === 0) {
            let topH = Math.random() * 200 + 50;
            pipes.push({ x: 320, top: topH, passed: false });
        }
        
        ctx.fillStyle = "#00b894";
        for(let i=0; i<pipes.length; i++) {
            let p = pipes[i]; 
            p.x -= 1.5; // Zmniejszona prędkość rur
            
            // Poszerzona szpara z 100 na 150px!
            ctx.fillRect(p.x, 0, 50, p.top);
            ctx.fillRect(p.x, p.top + 150, 50, 450); 
            
            // Kolizja
            let catHitBox = { x: 45, y: catY+5, w: 25, h: 20 };
            if(catHitBox.x + catHitBox.w > p.x && catHitBox.x < p.x + 50) {
                if(catHitBox.y < p.top || catHitBox.y + catHitBox.h > p.top + 150) gameActive = false;
            }
            if(catY > 430 || catY < -20) gameActive = false;
            
            // Punkt + 2 monety
            if(!p.passed && p.x < 40) { 
                flappyScore += 2; 
                p.passed = true;
                document.getElementById('flappy-score').innerText = flappyScore; 
            }
        }
        frames++;
        if(gameActive) flappyFrame = requestAnimationFrame(flappyLoop);
        else {
            ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,320,450);
            ctx.fillStyle = "white"; ctx.font = "bold 30px Nunito"; ctx.fillText("Koniec!", 110, 225);
        }
    }
    let frames = 0;

    window.closeFlappy = async function() {
        gameActive = false; cancelAnimationFrame(flappyFrame);
        document.getElementById('modal-flappy').style.display = 'none';
        if(flappyScore > 0) await updateDoc(catDocRef, { coins: state.coins + flappyScore });
    }
  </script>
</body>
</html>
