<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vinted Elite | Aro & Polak</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); box-shadow: 0 10px 20px -10px rgba(34, 197, 94, 0.5); }
        .chart-container { position: relative; height: 180px; width: 100%; }
    </style>
</head>
<body class="pb-10 px-4">

    <div id="app" class="max-w-md mx-auto">
        <header class="flex justify-between items-center py-6">
            <div>
                <p class="text-[10px] font-bold text-green-500 uppercase tracking-[0.2em]">Business Tracker</p>
                <h1 class="text-2xl font-black italic tracking-tighter">ARO <span class="text-gray-500">&</span> POLAK</h1>
            </div>
            <div v-if="loading" class="text-[10px] font-mono text-green-400 animate-pulse">SYNCING...</div>
        </header>

        <div class="glass rounded-[2rem] p-6 mb-6 animate__animated animate__fadeIn">
            <h3 class="text-[10px] font-bold text-gray-400 uppercase mb-4 tracking-widest text-center">Trend Sprzedaży</h3>
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="glass p-5 rounded-3xl border-b-2 border-green-500">
                <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Suma (Msc)</p>
                <p class="text-2xl font-extrabold text-white">{{ totalMonthly }}<span class="text-xs text-green-500 ml-1">zł</span></p>
            </div>
            <div class="glass p-5 rounded-3xl border-b-2 border-blue-500">
                <p class="text-[10px] text-blue-400 uppercase font-bold mb-1">Sztuk (Msc)</p>
                <p class="text-2xl font-extrabold text-white">{{ monthlyCount }}<span class="text-xs text-blue-400 ml-1">szt</span></p>
            </div>
        </div>

        <div class="glass p-6 rounded-[2rem] mb-10 shadow-2xl">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-gray-500 ml-2 uppercase font-bold">Nazwa przedmiotu</label>
                    <input v-model="newItem.name" type="text" placeholder="np. Bluza Nike" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 ml-2 uppercase font-bold">Kwota sprzedaży</label>
                    <input v-model.number="newItem.price" type="number" placeholder="0" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-green-500 text-xl font-bold">
                </div>
                <button @click="saveToFirebase" :disabled="loading || !newItem.name || !newItem.price" class="btn-green w-full py-4 rounded-2xl font-black text-white uppercase tracking-widest active:scale-95 transition-all">
                    DODAJ SPRZEDAŻ
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-widest px-2 text-center">Ostatnio sprzedane</p>
            <div v-for="item in sales" :key="item.id" class="glass p-5 rounded-3xl flex justify-between items-center animate__animated animate__fadeInUp">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center mr-4 text-lg">📦</div>
                    <div>
                        <p class="font-bold text-sm">{{ item.name }}</p>
                        <p class="text-[10px] text-gray-500">{{ item.date }}</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-green-400 font-black text-lg">{{ item.price }} zł</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCR4fwPjTKduaI56l61sj1dz7o1560JY5w",
            authDomain: "arek-918ae.firebaseapp.com",
            projectId: "arek-918ae",
            storageBucket: "arek-918ae.firebasestorage.app",
            messagingSenderId: "661615275552",
            appId: "1:661615275552:web:8ec18d85d7b4c0e6c05645"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getFirestore(fApp);
        const salesCol = collection(db, 'sales');

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    newItem: { name: '', price: null },
                    sales: [],
                    loading: false,
                    chart: null
                }
            },
            computed: {
                currentMonthSales() {
                    const now = new Date();
                    return this.sales.filter(s => s.rawDate && s.rawDate.getMonth() === now.getMonth());
                },
                totalMonthly() {
                    return this.currentMonthSales.reduce((sum, s) => sum + Number(s.price), 0).toFixed(0);
                },
                monthlyCount() {
                    return this.currentMonthSales.length;
                }
            },
            methods: {
                async saveToFirebase() {
                    this.loading = true;
                    try {
                        await addDoc(salesCol, {
                            name: this.newItem.name,
                            price: Number(this.newItem.price),
                            createdAt: new Date()
                        });
                        this.newItem = { name: '', price: null };
                    } catch (e) {
                        console.error(e);
                    } finally {
                        this.loading = false;
                    }
                },
                initChart() {
                    const ctx = document.getElementById('mainChart').getContext('2d');
                    this.chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                data: [],
                                borderColor: '#22c55e',
                                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                fill: true,
                                tension: 0.4,
                                borderWidth: 3,
                                pointRadius: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: { 
                                x: { ticks: { color: '#555', font: { size: 9 } }, grid: { display: false } },
                                y: { display: false }
                            }
                        }
                    });
                },
                updateChart() {
                    if (!this.chart || this.sales.length === 0) return;
                    const last7 = [...this.sales].slice(0, 7).reverse();
                    this.chart.data.labels = last7.map(s => s.name.substring(0, 8));
                    this.chart.data.datasets[0].data = last7.map(s => s.price);
                    this.chart.update();
                }
            },
            mounted() {
                this.initChart();
                const q = query(salesCol, orderBy('createdAt', 'desc'), limit(50));
                onSnapshot(q, (snapshot) => {
                    this.sales = snapshot.docs.map(doc => {
                        const data = doc.data();
                        const d = data.createdAt?.toDate() || new Date();
                        return { id: doc.id, ...data, rawDate: d, date: d.toLocaleDateString('pl-PL', {day: 'numeric', month: 'short'}) };
                    });
                    this.updateChart();
                });
            }
        }).mount('#app');
    </script>
</body>
</html>
